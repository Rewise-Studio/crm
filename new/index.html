<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Rewise CRM</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1E1E1E">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Rewise CRM">
<link rel="icon" href="favicon.ico">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Tenor+Sans&family=Commissioner:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

/* ═══════════════ ТЕМИ — CSS-ЗМІННІ ═══════════════ */
:root {
  /* Бренд (не залежить від теми) */
  --cognac:  #A0845C;
  --cognac-light: rgba(160,132,92,0.12);
  --cognac-border: rgba(160,132,92,0.3);
  --leather: #6B4F3A;
  --brown:   #3A3228;
  --linen:   #F0EBE3;

  /* Статуси */
  --st-new-bg:#E6F1FB; --st-new-fg:#185FA5;
  --st-work-bg:#FAEEDA; --st-work-fg:#854F0B;
  --st-ready-bg:#EAF3DE; --st-ready-fg:#3B6D11;
  --st-issued-bg:#F1EFE8; --st-issued-fg:#5F5E5A;
  --st-postponed-bg:#FCEBEB; --st-postponed-fg:#A32D2D;

  /* Навігація — завжди темна */
  --nav-bg: #181614;
  --nav-border: rgba(160,132,92,0.15);
  --nav-txt: rgba(240,235,227,0.5);
  --nav-txt-active: #fff;
}

/* СВІТЛА тема (за замовчуванням) */
:root, [data-theme="light"] {
  --bg:        #FAF8F6;
  --surface:   #FFFFFF;
  --surface-2: #FFFFFF;
  --txt:       #2A2621;
  --txt-2:     rgba(42,38,33,0.6);
  --txt-3:     rgba(42,38,33,0.4);
  --line:      rgba(58,50,40,0.12);
  --line-soft: rgba(58,50,40,0.08);
  --field-bg:  #FFFFFF;
  --field-border: rgba(58,50,40,0.15);
  --hover:     rgba(160,132,92,0.06);
  --receipt-shadow: 0 8px 28px rgba(58,50,40,0.14);
  --accent-soft: rgba(160,132,92,0.1);
}

/* ТЕМНА тема */
[data-theme="dark"] {
  --bg:        #1E1E1E;
  --surface:   #232020;
  --surface-2: #2a2622;
  --txt:       #F0EBE3;
  --txt-2:     rgba(240,235,227,0.6);
  --txt-3:     rgba(240,235,227,0.4);
  --line:      rgba(160,132,92,0.15);
  --line-soft: rgba(160,132,92,0.08);
  --field-bg:  rgba(240,235,227,0.05);
  --field-border: rgba(160,132,92,0.25);
  --hover:     rgba(160,132,92,0.1);
  --receipt-shadow: 0 8px 28px rgba(0,0,0,0.4);
  --accent-soft: rgba(160,132,92,0.12);
  --st-new-bg:#12324F; --st-new-fg:#9FCBF0;
  --st-work-bg:#3D2E12; --st-work-fg:#F0C066;
  --st-ready-bg:#22381A; --st-ready-fg:#A5D46F;
  --st-issued-bg:#2E2E2A; --st-issued-fg:#B4B2A9;
  --st-postponed-bg:#3D1A1A; --st-postponed-fg:#E88A8A;
}

body {
  background: var(--bg);
  color: var(--txt);
  font-family: 'Commissioner', sans-serif;
  font-weight: 300;
  min-height: 100vh;
  display: flex;
  transition: background 0.25s, color 0.25s;
}

/* ═══════════════ НАВІГАЦІЯ ═══════════════ */
.nav {
  width: 84px;
  min-width: 84px;
  background: var(--nav-bg);
  border-right: 1px solid var(--nav-border);
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: calc(22px + env(safe-area-inset-top)) 0 16px;
  gap: 3px;
  height: 100vh;
  position: sticky;
  top: 0;
  flex-shrink: 0;
  z-index: 20;
}
.nav-logo {
  font-family: 'Tenor Sans', serif;
  font-size: 15px;
  letter-spacing: 0.1em;
  color: var(--linen);
  margin-bottom: 18px;
}
.nav-item {
  width: 68px;
  padding: 10px 0;
  border-radius: 9px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 5px;
  font-size: 9px;
  letter-spacing: 0.02em;
  cursor: pointer;
  color: var(--nav-txt);
  border: none;
  background: transparent;
  font-family: 'Commissioner', sans-serif;
  transition: background 0.15s, color 0.15s;
  text-align: center;
}
.nav-item svg { width: 19px; height: 19px; stroke-width: 1.6; }
.nav-item:hover { color: rgba(240,235,227,0.8); }
.nav-item.active { background: var(--cognac); color: var(--nav-txt-active); }
.nav-spacer { flex: 1; }
.nav-div { width: 40px; height: 1px; background: var(--nav-border); margin: 7px 0; flex-shrink: 0; }
.nav-clock { text-align: center; margin: 8px 0; flex-shrink: 0; }
.nav-role-static { font-size: 9px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--nav-txt); text-align: center; opacity: 0.75; margin-bottom: 8px; flex-shrink: 0; }
.nav-analog { width: 58px; height: 58px; display: block; margin: 0 auto; }
.nav-clock-date { display: none; }

/* Міні-календар — тільки на широкій панелі */
.nav-mini-cal { display: none; width: 148px; padding: 0 4px 10px; flex-shrink: 0; }
.nmc-title { font-size: 9px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--cognac); text-align: center; margin-bottom: 7px; }
.nmc-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; }
.nmc-dow { font-size: 7px; color: rgba(240,235,227,0.35); text-align: center; padding-bottom: 3px; }
.nmc-day { font-size: 8.5px; text-align: center; padding: 3px 0; border-radius: 4px; color: rgba(240,235,227,0.55); }
.nmc-day.today { background: var(--cognac); color: #fff; font-weight: 500; }
.nmc-day.has-ev { box-shadow: inset 0 -2px 0 rgba(160,132,92,0.6); }


.nav-theme {
  width: 44px; height: 44px;
  border-radius: 10px;
  border: 1px solid var(--nav-border);
  background: transparent;
  color: var(--nav-txt);
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: color 0.15s, border-color 0.15s;
}
.nav-theme svg { width: 18px; height: 18px; stroke-width: 1.6; }
.nav-theme:hover { color: var(--linen); border-color: var(--cognac-border); }

/* ═══════════════ КОНТЕНТ ═══════════════ */
.main {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  min-height: 100vh;
  padding-top: env(safe-area-inset-top);
}
.page { display: none; flex-direction: column; flex: 1; }
.page.active { display: flex; }

.page-header {
  padding: 22px 28px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-shrink: 0;
}
.grp-switch { display: flex; gap: 8px; padding: 16px 28px 0; }
.grp-tab { padding: 8px 16px; border-radius: 18px; border: 1px solid var(--field-border); background: transparent; color: var(--txt-2); font-family: 'Commissioner', sans-serif; font-size: 13px; cursor: pointer; transition: all 0.15s; }
.grp-tab:hover { border-color: var(--cognac); }
.grp-tab.active { background: var(--cognac); border-color: var(--cognac); color: #fff; }
.page-title { font-family: 'Tenor Sans', serif; font-size: 20px; color: var(--txt); }

.btn-primary {
  background: var(--cognac);
  border: none;
  border-radius: 7px;
  color: #fff;
  font-family: 'Commissioner', sans-serif;
  font-size: 12px;
  font-weight: 400;
  padding: 10px 17px;
  cursor: pointer;
  display: flex; align-items: center; gap: 6px;
  transition: background 0.15s;
}
.btn-primary:hover { background: var(--leather); }
.btn-primary svg { width: 14px; height: 14px; stroke-width: 2; }

/* Заглушка */
.stub {
  flex: 1; display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  color: var(--txt-3); font-size: 13px; text-align: center;
  padding: 60px 20px; gap: 14px;
}
.stub svg { width: 34px; height: 34px; stroke-width: 1.4; opacity: 0.7; }

/* ═══════════════ ВКЛАДКА СТВОРИТИ (КОШТОРИС) ═══════════════ */
.create-wrap { display: flex; flex: 1; min-height: 0; gap: 18px; }
.create-left { flex: 1; min-width: 0; padding: 6px 0 32px 24px; overflow-y: auto; }
.create-right { width: 340px; flex-shrink: 0; min-width: 0; padding: 6px 24px 32px 0; }
.create-right-sticky { position: sticky; top: 8px; }

.cr-grid { display: flex; flex-direction: column; gap: 10px; max-width: none; }
.cr-box { background: var(--surface); border: 1px solid var(--line); border-radius: 11px; padding: 12px 14px; }
.cr-box-full { grid-column: 1 / -1; }
.cr-mgr-center { justify-content: center; }
.cr-client-row { display: flex; gap: 8px; align-items: flex-start; }
.cr-msg-icons { display: flex; gap: 6px; flex-shrink: 0; margin: 0; }
.cr-msg-ico-btn { width: 40px; height: 40px; padding: 0; display: flex; align-items: center; justify-content: center; }
.cr-msg-ico-btn .msg-ico { margin: 0; }
.cr-payterm { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; align-items: stretch; }
@media (max-width: 620px) { .cr-payterm { grid-template-columns: 1fr; } }
.cr-right-actions { display: flex; gap: 8px; margin-bottom: 12px; justify-content: flex-end; }
.cr-right-actions .cr-head-btn { flex: 0 0 auto; text-align: center; padding: 7px 12px; font-size: 11px; }
.cr-create-under { width: 100%; margin-top: 12px; }
.cr-box .cr-block-label { margin-top: 16px; }
.cr-box .cr-block-label.first { margin-top: 0; }

.cr-block-label { font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--cognac); margin: 14px 0 8px; }
.cr-block-label.first { margin-top: 6px; }

.cr-pills { display: flex; gap: 7px; flex-wrap: wrap; margin-bottom: 9px; }
.cr-pill { padding: 7px 13px; border-radius: 20px; border: 1px solid var(--field-border); background: transparent; color: var(--txt-2); font-family: 'Commissioner', sans-serif; font-size: 13px; font-weight: 300; cursor: pointer; transition: all 0.15s; white-space: nowrap; }
.cr-pill:hover { border-color: var(--cognac); color: var(--txt); }
.cr-pill.active { background: var(--cognac); color: #fff; border-color: var(--cognac); }
.cr-pill-wide { flex: 1; text-align: center; }

.cr-input { width: 100%; background: var(--field-bg); border: 1px solid var(--field-border); border-radius: 6px; padding: 9px 12px; color: var(--txt); font-family: 'Commissioner', sans-serif; font-size: 13px; font-weight: 300; outline: none; transition: border-color 0.15s; margin-bottom: 7px; }
input[type='date'] { -webkit-appearance: none; appearance: none; width: 100%; min-width: 0; max-width: 100%; }
.cr-input:focus { border-color: var(--cognac); }
.cr-input::placeholder { color: var(--txt-3); }

.cr-client-suggest { position: relative; }.cr-suggest-dd { position: absolute; top: calc(100% - 4px); left: 0; right: 0; background: var(--surface-2); border: 1px solid var(--field-border); border-radius: 6px; max-height: 200px; overflow-y: auto; z-index: 40; display: none; box-shadow: var(--receipt-shadow); }
.cr-suggest-dd.open { display: block; }
.cr-suggest-opt { padding: 10px 13px; font-size: 13px; color: var(--txt); cursor: pointer; border-bottom: 1px solid var(--line-soft); display: flex; justify-content: space-between; }
.cr-suggest-opt:last-child { border-bottom: none; }
.cr-suggest-opt:hover { background: var(--hover); }
.cr-suggest-opt .sug-phone { color: var(--txt-3); font-size: 11px; }

.cr-msg-pick { display: flex; gap: 8px; margin-bottom: 4px; }
.cr-msg-btn {
  display: flex; align-items: center; gap: 7px;
  padding: 8px 13px; border-radius: 8px;
  border: 1px solid var(--field-border); background: transparent;
  color: var(--txt-2); font-family: 'Commissioner', sans-serif;
  font-size: 12px; font-weight: 300; cursor: pointer;
  transition: all 0.15s;
}
.cr-msg-btn svg { width: 17px; height: 17px; }
.cr-msg-btn .msg-ico { color: var(--txt-3); transition: color 0.15s; }
.cr-msg-btn .msg-ico svg { fill: currentColor; }
.cr-msg-btn:hover { border-color: var(--cognac-border); color: var(--txt); }

.cc-inline-input { border: none; border-bottom: 1px dashed var(--cognac-border); background: transparent; color: var(--txt); font-family: 'Commissioner', sans-serif; font-size: 13px; text-align: right; padding: 2px 0; width: 140px; }
.cc-inline-input:focus { outline: none; border-bottom-color: var(--cognac); }
.cc-msg-picker { display: flex; gap: 6px; }
.cc-msg-btn { width: 26px; height: 26px; border-radius: 7px; border: 1px solid var(--field-border); background: transparent; display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--txt-3); }
.cc-msg-btn svg { width: 14px; height: 14px; fill: currentColor; }
.cc-msg-btn.active { border-color: transparent; color: #fff; }
.cr-msg-btn.active { border-color: transparent; color: #fff; }

.itemcard { background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 16px; margin-bottom: 12px; }
.itemcard-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
.itemcard-num { font-family: 'Tenor Sans', serif; font-size: 11px; color: var(--cognac); letter-spacing: 0.15em; }
.itemcard-rm { background: none; border: none; color: var(--txt-3); cursor: pointer; font-size: 17px; line-height: 1; padding: 0; transition: color 0.15s; }
.itemcard-rm:hover { color: var(--st-postponed-fg); }
.ic-row { display: flex; gap: 8px; margin-bottom: 9px; }
.rw-sel { position: relative; margin-bottom: 8px; }
.rw-sel-btn { width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 8px; background: var(--field-bg); border: 1px solid var(--field-border); border-radius: 6px; padding: 9px 12px; color: var(--txt); font-family: 'Commissioner', sans-serif; font-size: 13px; cursor: pointer; text-align: left; }
.rw-sel-btn.ph { color: var(--txt-3); }
.rw-sel-chev { width: 15px; height: 15px; color: var(--txt-3); transition: transform 0.15s; flex-shrink: 0; }
.rw-sel.open .rw-sel-chev { transform: rotate(180deg); }
.rw-sel-dd { position: absolute; top: calc(100% + 4px); left: 0; right: 0; background: var(--surface-2); border: 1px solid var(--field-border); border-radius: 8px; box-shadow: 0 8px 24px rgba(58,50,40,0.14); z-index: 50; max-height: 240px; overflow-y: auto; display: none; }
.rw-sel.open .rw-sel-dd { display: block; }
.rw-opt { padding: 9px 12px; font-size: 13px; color: var(--txt); cursor: pointer; }
.rw-opt:hover { background: var(--hover); }
.rw-opt.sel { color: var(--cognac); background: var(--accent-soft); }
.ic-details { margin: 10px 0 4px; }
.ic-details-toggle { display: inline-flex; align-items: center; gap: 6px; background: var(--field-bg); border: 1px solid var(--field-border); border-radius: 7px; color: var(--txt-2); font-family: 'Commissioner', sans-serif; font-size: 12px; cursor: pointer; padding: 8px 13px; transition: all 0.15s; }
.ic-details-toggle:hover { border-color: var(--cognac); color: var(--txt); }
.ic-details-body { margin-top: 8px; padding: 12px 13px; background: var(--field-bg); border: 1px solid var(--line-soft); border-radius: 8px; }
.ic-details-row { margin-bottom: 0; }
.ic-details-row .ic-field { flex: 1; min-width: 0; }
.ic-note-wrap { margin-top: 12px; }
.ic-note-label { display: block; font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--txt-3); margin-bottom: 5px; }
.ic-note { width: 100%; box-sizing: border-box; background: var(--field-bg); border: 1px solid var(--field-border); border-radius: 6px; padding: 8px 11px; color: var(--txt); font-family: 'Commissioner', sans-serif; font-size: 13px; font-weight: 300; outline: none; resize: vertical; min-height: 40px; }
.ic-note:focus { border-color: var(--cognac); }
.ic-note::placeholder { color: var(--txt-3); }
.d-item-note { margin: 5px 0 2px; font-size: 12px; font-style: italic; color: var(--txt-2); }
.ic-add-svc { width: 100%; display: block; margin-top: 10px; background: var(--accent-soft); border: 1px solid var(--cognac-border); border-radius: 7px; color: var(--cognac); font-family: 'Commissioner', sans-serif; font-size: 12px; letter-spacing: 0.04em; padding: 10px; cursor: pointer; transition: all 0.15s; }
.ic-add-svc:hover { background: var(--cognac); color: #fff; }
.ic-add-panel { margin-top: 10px; padding: 12px 13px; background: var(--field-bg); border: 1px solid var(--line-soft); border-radius: 8px; }
.ic-field { flex: 1; }
.ic-field label { display: block; font-size: 10px; color: var(--txt-3); letter-spacing: 0.08em; margin-bottom: 5px; }
.ic-select, .ic-mini { width: 100%; background: var(--field-bg); border: 1px solid var(--field-border); border-radius: 6px; padding: 9px 11px; color: var(--txt); font-family: 'Commissioner', sans-serif; font-size: 13px; font-weight: 300; outline: none; }
.ic-select:focus, .ic-mini:focus { border-color: var(--cognac); }
.ic-mini::placeholder { color: var(--txt-3); }
.ic-select option { background: var(--surface-2); color: var(--txt); }

.ic-svclist { margin-top: 4px; }
.ic-svcrow { display: flex; align-items: center; gap: 8px; padding: 8px 0; border-bottom: 1px solid var(--line-soft); }
.ic-svcrow:last-child { border-bottom: none; }
.ic-svcname { flex: 1; min-width: 0; font-size: 12px; color: var(--txt); overflow-wrap: anywhere; }
.ic-svcprice { font-size: 12px; color: var(--cognac); white-space: nowrap; flex-shrink: 0; cursor: pointer; border-bottom: 1px dashed transparent; transition: border-color 0.15s; }
.ic-svcprice:hover { border-bottom-color: var(--cognac-border); }
.ic-svcprice-input { width: 68px; background: var(--field-bg); border: 1px solid var(--cognac); border-radius: 5px; padding: 4px 7px; color: var(--txt); font-family: 'Commissioner', sans-serif; font-size: 12px; font-weight: 300; outline: none; text-align: right; }
.ic-svcdel { background: none; border: none; color: var(--txt-3); cursor: pointer; font-size: 14px; padding: 0; transition: color 0.15s; }
.ic-svcdel:hover { color: var(--st-postponed-fg); }

.ic-search-wrap { position: relative; margin-top: 10px; }
.ic-search { width: 100%; background: var(--field-bg); border: 1px solid var(--field-border); border-radius: 6px; padding: 9px 11px; color: var(--txt); font-family: 'Commissioner', sans-serif; font-size: 12px; font-weight: 300; outline: none; }
.ic-search:focus { border-color: var(--cognac); }
.ic-search::placeholder { color: var(--txt-3); }
.ic-dd { position: absolute; top: calc(100% + 4px); left: 0; right: 0; background: var(--surface-2); border: 1px solid var(--field-border); border-radius: 6px; max-height: 210px; overflow-y: auto; z-index: 30; display: none; box-shadow: var(--receipt-shadow); }
.ic-dd.open { display: block; }
.ic-opt { padding: 9px 11px; font-size: 12px; color: var(--txt); cursor: pointer; border-bottom: 1px solid var(--line-soft); display: flex; justify-content: space-between; gap: 8px; }
.ic-opt:last-child { border-bottom: none; }
.ic-opt:hover { background: var(--hover); }
.ic-opt .o-name { display: flex; flex-direction: column; gap: 2px; }
.ic-opt .o-hint { font-size: 10px; color: var(--txt-3); font-weight: 300; line-height: 1.3; }
.ic-opt .o-price { color: var(--cognac); white-space: nowrap; align-self: flex-start; }
.ic-opt .o-empty { color: var(--txt-3); font-style: italic; }
.ic-manual { display: flex; gap: 8px; margin-top: 8px; }
.ic-manual .ic-mini { flex: 1; }
.ic-manual-add { background: var(--cognac); border: none; border-radius: 6px; color: #fff; font-size: 16px; width: 34px; cursor: pointer; flex-shrink: 0; transition: background 0.15s; }
.ic-manual-add:hover { background: var(--leather); }

.ic-oplabel, .ic-otherlabel { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--cognac); margin: 14px 0 8px; }
.ic-otherlabel { color: var(--txt-3); margin-top: 16px; padding-top: 12px; border-top: 1px solid var(--line-soft); }
.ic-oprow { display: flex; gap: 8px; flex-wrap: wrap; }
.ic-op { flex: 1; min-width: 96px; display: flex; flex-direction: column; align-items: flex-start; gap: 3px; padding: 10px 13px; border-radius: 9px; border: 1px solid var(--field-border); background: transparent; color: var(--txt); font-family: 'Commissioner', sans-serif; font-size: 13px; cursor: pointer; transition: all 0.15s; }
.ic-op:hover { border-color: var(--cognac); }
.ic-op .ic-op-price { font-size: 12px; color: var(--cognac); }
.ic-op.on { background: var(--cognac); border-color: var(--cognac); color: #fff; }
.ic-op.on .ic-op-price { color: rgba(255,255,255,0.85); }
.ic-op.off { opacity: 0.45; }
.ic-op-hint { font-size: 11px; color: var(--txt-3); font-style: italic; margin-top: 8px; }

.odm-bg {
  display: none; position: fixed; inset: 0;
  background: rgba(0,0,0,0.5); z-index: 300;

  padding: 40px 20px; overflow-y: auto;
}

.odm {
  background: var(--bg); border-radius: 14px;
  width: 900px; max-width: 100%;
  box-shadow: 0 24px 64px rgba(0,0,0,0.35);
  position: relative;
  animation: odmIn 0.18s ease;
}
@keyframes odmIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
.odm-close {
  position: absolute; top: 14px; right: 16px;
  cursor: pointer; font-size: 24px; line-height: 1;
  color: var(--txt-2); z-index: 2; padding: 4px 8px; border-radius: 6px;

}

@media (max-width: 768px) {

  .odm-scroll { max-height: 100vh; padding: 20px 18px 30px; }
}

/* ═══════════════ ВКЛАДКИ КЛІЄНТИ / ФІНАНСИ / СТАТИСТИКА ═══════════════ */
.tab-scroll { flex: 1; overflow-y: auto; padding: 8px 28px 40px; }

.stat-cards { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 20px; padding: 0 28px; }

.stat-panel { background: var(--surface); border: 1px solid var(--line); border-radius: 11px; padding: 18px 20px; margin-bottom: 14px; }

.stat-cols { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 14px; }

.nav-logout:hover { color: var(--linen); border-color: var(--cognac-border); }

/* Приймальник: приховуємо редагування карток, бонуси та рейтинг */
body[data-role="operator"] .detail-edit,
body[data-role="operator"] .admin-only { display: none !important; }
body[data-role="operator"] .rating-pick { pointer-events: none; border-bottom: none; }
body.no-auth .role-badge, body.no-auth .nav-logout { display: none; }
/* ═══════════════ ФОТО ВИРОБУ ═══════════════ */
.tailor-area {
  min-height: 78px; resize: vertical; line-height: 1.55;
  font-family: 'Commissioner', sans-serif;
}
.photo-area { min-height: 92px; font-size: 12px; }
.tailor-photos { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 8px; }
.tl-two { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.photo-empty { font-size: 12px; color: var(--txt-3); font-style: italic; padding: 6px 0; }
@media (max-width: 768px) { .tl-two { grid-template-columns: 1fr; } }
.tailor-photo { position: relative; aspect-ratio: 1; border-radius: 8px; overflow: hidden; background: var(--accent-soft); border: 1px solid var(--line); }
.tailor-photo img { width: 100%; height: 100%; object-fit: cover; cursor: zoom-in; display: block; }
.tailor-photo-link { display: flex; align-items: center; justify-content: center; height: 100%; padding: 8px; font-size: 10px; color: var(--cognac); text-align: center; text-decoration: none; }
.tailor-text { font-size: 13px; color: var(--txt); line-height: 1.6; white-space: pre-wrap; }

#photo-viewer {
  display: none; position: fixed; inset: 0; z-index: 600;
  background: rgba(0,0,0,0.85); align-items: center; justify-content: center;
  padding: 24px; cursor: zoom-out;
}
#photo-viewer.open { display: flex; }
#photo-viewer img { max-width: 100%; max-height: 100%; border-radius: 8px; }

/* ═══════════════ КАРТКИ ВИГОТОВЛЕННЯ ═══════════════ */
.tcards { display: grid; grid-template-columns: repeat(auto-fill, minmax(212px, 1fr)); gap: 14px; }
.tcard {
  background: var(--surface); border: 1px solid var(--line);
  border-top: 3px solid var(--cognac); border-radius: 12px;
  overflow: hidden; cursor: pointer; transition: transform 0.15s, box-shadow 0.15s;
  display: flex; flex-direction: column;
}
.tcard:hover { transform: translateY(-2px); box-shadow: 0 8px 22px rgba(0,0,0,0.1); }
.tcard.warn { border-color: var(--st-postponed-fg); }
.tc-photo { position: relative; aspect-ratio: 1; background: var(--accent-soft); overflow: hidden; }
.tc-photo .tc-img { width: 100%; height: 100%; object-fit: cover; display: block; cursor: pointer; }
.tc-photo.tc-empty { display: flex; align-items: center; justify-content: center; color: var(--txt-3); font-size: 12px; }
.tc-tag {
  position: absolute; left: 8px; bottom: 8px;
  font-size: 9px; letter-spacing: 0.06em; text-transform: uppercase;
  padding: 3px 8px; border-radius: 10px; backdrop-filter: blur(4px);
}
.tc-tag.done { background: rgba(47,169,140,0.85); color: #fff; }
.tc-tag.sketch { background: rgba(160,132,92,0.85); color: #fff; }
.tc-body { padding: 12px 14px 13px; display: flex; flex-direction: column; gap: 5px; flex: 1; }
.tc-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.tc-num { font-size: 11px; color: var(--txt-3); }
.tc-title { font-size: 14px; color: var(--txt); line-height: 1.3; }
.tc-sub { font-size: 11px; color: var(--txt-3); line-height: 1.4; }
.tc-product { font-size: 11px; color: var(--txt-3); line-height: 1.35; margin-top: 2px; }
.tc-foot { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin-top: auto; padding-top: 8px; }
.tc-date { font-size: 11px; color: var(--txt-3); }
.tc-date.warn { color: var(--st-postponed-fg); font-weight: 500; }
.tc-price { font-family: 'Tenor Sans', serif; font-size: 15px; color: var(--cognac); white-space: nowrap; }
@media (max-width: 620px) {
  .tcards { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
  .tc-title { font-size: 13px; }
}

/* ═══════════════ ОНЛАЙН-ПРАЙС ═══════════════ */
.pl-wrap { max-width: 860px; margin: 0 auto; }
.pl-tabs { display: flex; gap: 8px; margin-bottom: 12px; }
.pl-tab { flex: 1; text-align: center; padding: 12px; border-radius: 10px; background: transparent; border: 1px solid var(--field-border); color: var(--txt-2); font-family: 'Commissioner', sans-serif; font-size: 15px; cursor: pointer; transition: all 0.15s; }
.pl-tab:hover { border-color: var(--cognac); }
.pl-tab.active { background: var(--accent-soft); border-color: var(--cognac); color: var(--leather); }
[data-theme="dark"] .pl-tab.active { color: var(--txt); }
.pl-searchbar { display: flex; align-items: center; gap: 9px; background: var(--surface-2); border: 1px solid var(--field-border); border-radius: 10px; padding: 11px 14px; margin-bottom: 12px; }
.pl-searchbar svg { width: 16px; height: 16px; stroke-width: 1.8; color: var(--cognac); flex-shrink: 0; }
.pl-searchbar input { flex: 1; min-width: 0; background: none; border: none; outline: none; color: var(--txt); font-family: 'Commissioner', sans-serif; font-size: 14px; }
.pl-searchbar input::placeholder { color: var(--txt-3); }
.pl-filters { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-bottom: 16px; }
.pl-filter { padding: 7px 14px; border-radius: 18px; border: 1px solid var(--field-border); background: transparent; color: var(--txt-2); font-family: 'Commissioner', sans-serif; font-size: 13px; cursor: pointer; transition: all 0.15s; }
.pl-filter:hover { border-color: var(--cognac); }
.pl-filter.active { background: var(--cognac); border-color: var(--cognac); color: #fff; }
.pl-cards { column-count: 2; column-gap: 10px; }
.pl-cards .pl-scard { break-inside: avoid; -webkit-column-break-inside: avoid; margin-bottom: 10px; }
@media (max-width: 720px) { .pl-cards { column-count: 1; } }
.pl-scard { background: var(--surface-2); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; cursor: pointer; transition: background 0.12s, box-shadow 0.12s; }
.pl-scard:hover { background: var(--hover); }
.pl-scard.pl-lit { background: var(--accent-soft); box-shadow: inset 3px 0 0 var(--cognac); }
.pl-scard-name { font-size: 14px; color: var(--txt); line-height: 1.35; }
.pl-scard-hint { font-size: 11px; color: var(--txt-3); margin-top: 3px; line-height: 1.4; }
.pl-scard-foot { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin-top: 9px; }
.pl-scard-price { font-family: 'Tenor Sans', serif; font-size: 17px; color: var(--cognac); white-space: nowrap; }
.pl-scard-price .pl-unit { font-family: 'Commissioner', sans-serif; font-size: 11px; color: var(--txt-3); }
.pl-scard-term { font-size: 11px; color: var(--txt-3); white-space: nowrap; }
.pl-card-label { display: flex; align-items: center; font-family: 'Tenor Sans', serif; font-size: 14px; letter-spacing: 0.01em; color: var(--txt); background: var(--accent-soft); padding: 13px 18px; border-bottom: 1px solid var(--cognac-border); cursor: grab; user-select: none; -webkit-user-select: none; }
.pl-card-label:active { cursor: grabbing; }
.pl-grip { display: inline-flex; color: var(--cognac); margin-right: 9px; opacity: 0.6; flex-shrink: 0; }
.pl-ghost { opacity: 0.35; }
.pl-drag { box-shadow: 0 14px 34px rgba(58,50,40,0.2); }
.pl-row { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding: 11px 18px; border-bottom: 1px solid var(--line-soft); cursor: pointer; transition: background 0.12s, box-shadow 0.12s; }
.pl-row:last-child { border-bottom: none; padding-bottom: 15px; }
.pl-row:hover { background: var(--hover); }
.pl-row.pl-lit { background: var(--accent-soft); box-shadow: inset 3px 0 0 var(--cognac); }
.pl-row.pl-lit .pl-price { color: var(--leather); }
.pl-name { flex: 1; min-width: 0; font-size: 13px; color: var(--txt); line-height: 1.35; }
.pl-hint { font-size: 10px; color: var(--txt-3); margin-top: 3px; line-height: 1.4; }
.pl-price { font-family: 'Tenor Sans', serif; font-size: 15px; color: var(--cognac); white-space: nowrap; flex-shrink: 0; }
.pl-meta { display: flex; flex-direction: column; align-items: flex-end; gap: 2px; flex-shrink: 0; }
.pl-term { font-size: 10px; color: var(--txt-3); white-space: nowrap; }
.pl-unit { font-family: 'Commissioner', sans-serif; font-size: 11px; color: var(--txt-3); margin-left: 4px; }
@media (max-width: 680px) {
  .pl-name { font-size: 14px; }
  .pl-price { font-size: 16px; }
}

/* ═══════════════ НАЛАШТУВАННЯ ═══════════════ */
.price-row { display: grid; grid-template-columns: 1fr 76px 84px 74px 40px; gap: 10px; align-items: center; padding: 9px 0; border-bottom: 1px solid var(--line-soft); }
.price-row:last-of-type { border-bottom: none; }
.price-row.hidden-row { opacity: 0.5; }
.price-name { font-size: 13px; color: var(--txt); }
.price-hidden-tag { font-size: 10px; color: var(--txt-3); }
.price-unit { font-size: 11px; color: var(--txt-3); }
.price-input { background: var(--field-bg); border: 1px solid var(--field-border); border-radius: 6px; padding: 7px 9px; color: var(--txt); font-family: 'Commissioner', sans-serif; font-size: 13px; outline: none; width: 100%; text-align: right; }
.price-input:focus { border-color: var(--cognac); }
.price-btn { background: none; border: 1px solid var(--line); border-radius: 6px; color: var(--txt-2); cursor: pointer; font-size: 13px; padding: 6px 0; transition: all 0.15s; }
.price-btn:hover { border-color: var(--cognac); }
.price-add { display: flex; gap: 8px; margin-top: 12px; padding-top: 12px; border-top: 1px dashed var(--cognac-border); }
.price-add .ic-mini { flex: 1; }

.price-row.pending { background: var(--accent-soft); border-radius: 7px; padding-left: 8px; padding-right: 8px; }
.price-was { font-size: 10px; color: var(--txt-3); text-decoration: line-through; }
.price-new-tag { font-size: 10px; color: #2FA98C; }
.price-input-static { font-size: 13px; color: var(--cognac); text-align: right; }

.pending-bar {
  position: sticky; bottom: 0; margin-top: 16px;
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  background: var(--surface); border: 1px solid var(--cognac-border);
  border-radius: 10px; padding: 12px 16px;
  box-shadow: 0 -4px 20px rgba(0,0,0,0.08);
}
.pending-count { flex: 1; font-size: 13px; color: var(--txt); }
.pending-cancel { background: none; border: 1px solid var(--field-border); border-radius: 7px; color: var(--txt-2); padding: 9px 14px; cursor: pointer; font-family: 'Commissioner', sans-serif; font-size: 12px; }
.pending-confirm { background: var(--cognac); border: none; border-radius: 7px; color: #fff; padding: 9px 16px; cursor: pointer; font-family: 'Commissioner', sans-serif; font-size: 12px; }
.pending-confirm:hover { background: var(--leather); }

.chg-list { border: 1px solid var(--line); border-radius: 9px; padding: 6px 14px; }
.chg-row { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding: 9px 0; border-bottom: 1px solid var(--line-soft); font-size: 13px; }
.chg-row:last-child { border-bottom: none; }
.chg-name { color: var(--txt); }
.chg-val { color: var(--txt-2); white-space: nowrap; }
.chg-val b { color: var(--cognac); font-weight: 500; }
.chg-val s { color: var(--txt-3); }

.param-row { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 12px 0; border-bottom: 1px solid var(--line-soft); }
.param-name { font-size: 13px; color: var(--txt); }
.param-hint { font-size: 11px; color: var(--txt-3); margin-top: 3px; line-height: 1.5; }
.param-input { max-width: 90px; text-align: right; }

@media (max-width: 768px) {
  .price-row { grid-template-columns: 1fr 64px 56px 34px; }
  .price-row .price-unit { display: none; }
  .price-add { flex-wrap: wrap; }
}

/* ═══════════════ КАЛЕНДАР ═══════════════ */
.cal-head { display: flex; align-items: center; gap: 14px; margin-bottom: 16px; flex-wrap: wrap; }
.cal-nav-btn { background: transparent; border: 1px solid var(--field-border); border-radius: 7px; color: var(--txt-2); width: 34px; height: 34px; cursor: pointer; font-size: 16px; transition: all 0.15s; }
.cal-nav-btn:hover { border-color: var(--cognac); color: var(--txt); }
.cal-month { font-family: 'Tenor Sans', serif; font-size: 18px; color: var(--txt); min-width: 190px; }
.cal-today-btn { background: transparent; border: 1px solid var(--cognac-border); border-radius: 7px; color: var(--cognac); padding: 7px 13px; font-family: 'Commissioner', sans-serif; font-size: 12px; cursor: pointer; }
.cal-today-btn:hover { background: var(--accent-soft); }
.cal-filters { margin-left: auto; display: flex; gap: 6px; }

.cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
.cal-dow { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--txt-3); text-align: center; padding-bottom: 4px; }
.cal-cell { min-height: 92px; background: var(--surface); border: 1px solid var(--line); border-radius: 9px; padding: 7px 8px; cursor: pointer; transition: border-color 0.15s, background 0.15s; overflow: hidden; }
.cal-cell:hover { border-color: var(--cognac-border); }
.cal-cell.other { opacity: 0.4; }
.cal-cell.today { border-color: var(--cognac); background: var(--accent-soft); }
.cal-daynum { font-size: 12px; color: var(--txt-2); margin-bottom: 5px; }
.cal-dayhead { display: flex; align-items: center; justify-content: space-between; margin-bottom: 5px; }
.cal-dayhead .cal-daynum { margin-bottom: 0; }
.cal-load { font-size: 9px; font-weight: 500; padding: 1px 6px; border-radius: 8px; line-height: 1.4; }
.cal-load.free { background: rgba(47,169,140,0.16); color: #2FA98C; }
.cal-load.busy { background: var(--st-work-bg); color: var(--st-work-fg); }
.cal-load.full { background: var(--st-postponed-bg); color: var(--st-postponed-fg); }
.cr-deadline-hint { margin-top: 10px; display: flex; flex-direction: column; gap: 8px; }
.deadline-load { font-size: 12px; padding: 7px 11px; border-radius: 7px; }
.deadline-load.free { background: rgba(47,169,140,0.14); color: #2FA98C; }
.deadline-load.busy { background: var(--st-work-bg); color: var(--st-work-fg); }
.deadline-load.full { background: var(--st-postponed-bg); color: var(--st-postponed-fg); }
.deadline-reco { background: transparent; border: 1px dashed var(--cognac-border); border-radius: 7px; color: var(--cognac); font-family: 'Commissioner', sans-serif; font-size: 12px; padding: 9px 12px; cursor: pointer; text-align: left; transition: background 0.15s; }
.deadline-reco:hover { background: var(--accent-soft); }
.cal-cell.today .cal-daynum { color: var(--cognac); font-weight: 500; }
.cal-ev { font-size: 10px; padding: 2px 6px; border-radius: 5px; margin-bottom: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cal-ev.order { background: rgba(160,132,92,0.16); color: var(--cognac); }
.cal-ev.task { background: rgba(47,169,140,0.16); color: #2FA98C; }
.cal-ev.tailor { background: rgba(115,96,242,0.16); color: #7360F2; }
.cal-ev.late { background: var(--st-postponed-bg); color: var(--st-postponed-fg); }
.cal-more { font-size: 9px; color: var(--txt-3); }

.cal-day-list { display: flex; flex-direction: column; gap: 8px; }
.cal-day-item { display: flex; align-items: center; gap: 10px; background: var(--surface); border: 1px solid var(--line); border-radius: 9px; padding: 12px 14px; cursor: pointer; }
.cal-day-item:hover { background: var(--hover); }
.cal-tag { font-size: 10px; padding: 3px 8px; border-radius: 10px; white-space: nowrap; }
.cal-tag.order { background: rgba(160,132,92,0.16); color: var(--cognac); }
.cal-tag.task { background: rgba(47,169,140,0.16); color: #2FA98C; }
.cal-tag.tailor { background: rgba(115,96,242,0.16); color: #7360F2; }
.cal-day-txt { flex: 1; font-size: 13px; color: var(--txt); }
.cal-day-sub { font-size: 11px; color: var(--txt-3); }

/* ═══════════════ ЗВЕДЕНИЙ ЧЕК ═══════════════ */
.summary-search-wrap { margin-bottom: 4px; }
#summary-matches { margin-top: 4px; }
.summary-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 18px; max-height: 55vh; overflow-y: auto; }
.summary-row { display: grid; grid-template-columns: 22px 60px 1.4fr 1.6fr 90px; gap: 10px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 9px; padding: 11px 14px; cursor: pointer; font-size: 12px; }
.summary-row input[type="checkbox"] { width: 16px; height: 16px; accent-color: var(--cognac); cursor: pointer; }
.sr-num { color: var(--txt-3); }
.sr-name { color: var(--txt); }
.sr-svc { color: var(--txt-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sr-sum { color: var(--cognac); text-align: right; }

#summary-print { background: #FBF8F3; color: #1E1E1E; border-radius: 8px; padding: 32px 28px; font-family: 'Commissioner', sans-serif; max-width: 560px; margin: 0 auto; }
[data-theme="dark"] #summary-print { background: var(--linen); }
.sum-print-header { text-align: center; padding-bottom: 16px; border-bottom: 1px solid rgba(58,50,40,0.15); margin-bottom: 16px; }
.sum-print-logo { font-family: 'Tenor Sans', serif; font-size: 13px; letter-spacing: 0.25em; color: var(--brown); }
.sum-print-tag { font-size: 10px; color: #3A3228; letter-spacing: 0.15em; text-transform: uppercase; margin-top: 4px; }
.sum-print-meta { display: flex; justify-content: space-between; font-size: 13px; font-weight: 600; color: #1E1E1E; margin-bottom: 18px; }
.sum-order-block { margin-bottom: 14px; padding-bottom: 12px; border-bottom: 1px solid rgba(58,50,40,0.1); }
.sum-order-head { font-family: 'Tenor Sans', serif; font-size: 11px; color: var(--cognac); letter-spacing: 0.1em; margin-bottom: 8px; }
.sum-svc-row { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; font-size: 13px; color: #1E1E1E; padding: 3px 0; }
.sum-svc-row > span:first-child { flex: 1; min-width: 0; }
.sum-svc-row > span:last-child { white-space: nowrap; flex-shrink: 0; }
.sum-print-total { display: flex; justify-content: space-between; align-items: baseline; padding-top: 14px; border-top: 1px solid rgba(58,50,40,0.2); margin-top: 6px; font-family: 'Tenor Sans', serif; font-size: 19px; }
.sum-print-footer { text-align: center; margin-top: 18px; padding-top: 12px; border-top: 1px solid rgba(58,50,40,0.1); font-size: 9px; color: rgba(58,50,40,0.65); letter-spacing: 0.2em; text-transform: uppercase; }
.sum-actions { display: flex; gap: 10px; margin-top: 20px; max-width: 560px; margin-left: auto; margin-right: auto; }

@media print {
  body * { visibility: hidden; }
  #summary-print, #summary-print * { visibility: visible; }
  #summary-print { position: absolute; top: 0; left: 0; width: 100%; box-shadow: none; }
  .no-print, .odm-close, .nav { display: none !important; }
}

/* ═══════════════ МОБІЛЬНА ВЕРСІЯ ═══════════════ */
/* ═══════════════ БОКОВА ПАНЕЛЬ — компактна на невисоких екранах ═══════════════
   Стосується десктопа і планшета в горизонтальній орієнтації. */
.nav { overflow-y: auto; scrollbar-width: none; }
.nav::-webkit-scrollbar { display: none; }

@media (orientation: landscape) and (max-height: 900px) {
  .nav { padding: 12px 0 8px; gap: 1px; justify-content: flex-start; }
  .nav-logo { margin-bottom: 8px; font-size: 14px; }
  .nav-item { padding: 6px 0; gap: 3px; font-size: 8px; }
  .nav-item svg { width: 17px; height: 17px; }
  .nav-div { margin: 3px 0; }
  .nav-theme { width: 36px; height: 32px; }
  .nav-theme svg { width: 15px; height: 15px; }
  .role-badge { font-size: 8px; }
  /* Годинник лишається внизу панелі разом з датою */
  .nav-clock { margin-bottom: 8px; }
  .nav-analog { width: 50px; height: 50px; }
  .nav-clock-date { font-size: 8px; margin-top: 4px; }
}
@media (orientation: landscape) and (max-height: 760px) {
  .nav { width: 74px; min-width: 74px; padding: 8px 0 6px; }
  .nav-logo { margin-bottom: 5px; font-size: 13px; }
  .nav-item { width: 62px; padding: 4px 0; gap: 2px; }
  .nav-item svg { width: 16px; height: 16px; }
  .nav-clock { margin-top: 7px; margin-bottom: 6px; }
  .nav-analog { width: 42px; height: 42px; }
  .nav-clock-date { font-size: 7.5px; }
}

/* Широка панель — на великих екранах */
@media (min-width: 1400px) {
  .nav { width: 172px; min-width: 172px; padding: 20px 0 14px; }
  .nav-item {
    width: 148px; flex-direction: row; justify-content: flex-start;
    gap: 11px; padding: 9px 13px; font-size: 11px; text-align: left;
  }
  .nav-item svg { width: 17px; height: 17px; flex-shrink: 0; }
  .nav-div { width: 120px; }
  .nav-analog { width: 82px; height: 82px; }
  .nav-mini-cal { display: block; }
  .role-badge { font-size: 9px; }

/* ═══════════════ ПАНЕЛЬ ЗНИЗУ ═══════════════

const SHEET_ID = "1kDJ893PFa_DTNKt-r8wQES_JFXbJSDNU8niRLz70Aao";
const PRICE_GID = "934403054";
const API_URL = "https://price-production-97b5.up.railway.app/order";

/* ═══════════════ РЕКВІЗИТИ ДЛЯ ОПЛАТИ (номер картки) ═══════════════
   Номер картки вводиться у застосунку: Налаштування → Параметри → «Реквізити для оплати».
   Зберігається в листі «Налаштування» (не в коді) і підтягується при завантаженні. */
const PAY = {
  card:      "",         // заповнюється з налаштувань
  cardLabel: "Картка",
  holder:    "",         // імʼя одержувача (необовʼязково)
  qrLink:    "",
  qrImg:     ""
};

/* Планування завантаження: скільки робіт студія комфортно бере на день.
   Використовується для підказки рекомендованої дати (не блокує вибір). */
let DAILY_CAP = 5;

/* ═══════════════ ДОСТУП: АДМІН / ПРИЙМАЛЬНИК ═══════════════
   Паролі зберігаються у вигляді SHA-256 хешів.
   Щоб змінити пароль — згенеруй новий хеш і встав сюди.
   Увага: це м'який захист від випадкових правок, а не справжня безпека —
   код сторінки публічний, тож не використовуй тут важливі паролі.
*/
/* Поки що вхід вимкнено — увімкнеш, коли все запрацює: постав true */
const AUTH_ENABLED = true;

const ROLE_HASHES = {
  admin: "888df25ae35772424a560c7152a1de794440e0ea5cfee62828333a456a506e05" // 9999
};
const ROLE_LABELS = { admin: "Адміністратор", operator: "Приймальник" };
let userRole = "";

function isAdmin() { return userRole === "admin"; }

async function sha256(str) {
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(str));
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,"0")).join("");
}

async function doLogin() {
  const pw = document.getElementById("login-pw").value;
  const err = document.getElementById("login-err");
  if (!pw) { err.textContent = "Введіть пароль"; return; }
  let hash;
  try { hash = await sha256(pw); }
  catch(e) { err.textContent = "Помилка перевірки"; return; }
  let role = "";
  for (const r in ROLE_HASHES) { if (ROLE_HASHES[r] === hash) role = r; }
  if (!role) { err.textContent = "Невірний пароль"; return; }
  userRole = role;
  try { sessionStorage.setItem("rw_role", role); } catch(e) {}
  err.textContent = "";
  document.getElementById("login-bg").classList.add("hidden");
  applyRoleUI();
  if (renderers[currentPage]) renderers[currentPage]();
}

function logout() {
  userRole = "operator";
  try { sessionStorage.setItem("rw_role", "operator"); } catch(e) {}
  applyRoleUI();
  const lb = document.getElementById("login-bg");
  if (lb) lb.classList.add("hidden");
  if (typeof showPage === "function") showPage("worklist");
}

function applyRoleUI() {
  const badge = document.getElementById("role-badge");
  if (badge) badge.textContent = ROLE_LABELS[userRole] || "";
  document.body.setAttribute("data-role", userRole);
  const rb = document.getElementById("role-action-btn");
  if (rb) rb.textContent = (userRole === "admin") ? "Вихід" : "Адмін";
}
function openAdminLogin() {

function gv(obj, ...keys) {
  for (const k of keys) { if (obj[k] !== undefined && obj[k] !== "") return obj[k]; }
  return "";
}

/* gviz віддає дати як "Date(2026,7,8)" (місяць рахується з 0). Приводимо до ДД.ММ.РРРР,
   щоб не показувати клієнту сире значення. Усе, що не дата — лишаємо як є. */
function gvizDate(v) {
  const s = String(v);
  const m = s.match(/^Date\((\d+),(\d+),(\d+)(?:,(\d+),(\d+))?/);
  if (!m) return s;
  const pad = n => String(n).padStart(2, "0");
  let out = pad(m[3]) + "." + pad(parseInt(m[2]) + 1) + "." + m[1];
  if (m[4] !== undefined) out += " " + pad(m[4]) + ":" + pad(m[5]);
  return out;
}

async function parseSheet(res, cols) {
  try {
    const text = await res.text();
    // gviz повертає google.visualization.Query.setResponse({...}); — виріжемо JSON надійно
    const start = text.indexOf("{");
    const end = text.lastIndexOf("}");
    if (start === -1 || end === -1) return [];
    const json = JSON.parse(text.substring(start, end + 1));
    if (!json.table || !json.table.rows) return [];
    return json.table.rows.map(row => {
      const obj = {};
      const cells = row.c || [];
      cols.forEach((col, i) => {
        const cell = cells[i];
        if (!cell) { obj[col] = ""; return; }
        // Пріоритет: значення .v (сире), потім .f (форматоване)
        let val = (cell.v !== null && cell.v !== undefined) ? cell.v : (cell.f !== undefined ? cell.f : "");
        obj[col] = gvizDate(val);
      });
      return obj;
    }).filter(r => {
      const key = r[cols[0]];
      return key && typeof key === "string" && key.indexOf("RW-") === 0;
    });
  } catch(e) { console.error("parseSheet error:", e); return []; }
}

async function parsePartners(res) {

      const cell = row.c[0];
      return cell && cell.v ? String(cell.v) : "";
    }).filter(v => v && v !== "Імя" && v !== "Имя");
  } catch(e) { return []; }
}

/* Три «модельні» операції — ціна тягнеться з прайсу за тарифом/розміром */
const CORE_OPS = ["Чищення", "Фарбування", "Реставрація"];
/* Знайти рядок прайсу: назва містить операцію + усі токени (тариф / розмір+матеріал) */
function findCorePrice(category, op, tokens) {
  const cat = PRICE[category]; if (!cat) return null;
  let found = null;
  Object.keys(cat.departments).forEach(dept => {
    cat.departments[dept].forEach(s => {
      if (found || s.active === false) return;
      const nm = s.name.toLowerCase();
      if (nm.indexOf(op.toLowerCase()) === -1) return;
      if (tokens.every(t => nm.indexOf(t.toLowerCase()) !== -1)) found = s;
    });
  });
  return found;
}
/* Ціна операції для конкретного товару (з урахуванням розміру/матеріалу) */
function opPriceFor(item, op) {
  if (!item.model) return null;
  if (item.category === "bags") {
    if (item.model === "Поясний ремінь") {
      return findCorePrice("bags", op, ["поясний ремінь"]);
    }
    const size = item.size || "M";
    const mat = (op === "Чищення") ? (item.material || "шкіряна") : "шкіряна";
    return findCorePrice("bags", op, ["сумка " + size, mat]);
  }
  if (!item.size) return null; // для взуття size = тарифна група
  return findCorePrice("shoes", op, [item.size]);
}
/* Підпис операції у чек: лише операція (+ розмір для сумок). Модель — у заголовку виробу. */
function coreLineName(item, op) {
  const size = (item.category === "bags" && item.size) ? " (" + item.size + ")" : "";
  return op + size;
}
/* Перерахувати всі модельні рядки товару після зміни моделі/розміру/матеріалу */
function recomputeCore(it) {
  it.services.forEach(s => {
    if (s.kind !== "core") return;
    const p = opPriceFor(it, s.op);
    if (p) s.price = parseInt(p.price) || 0;
    s.name = coreLineName(it, s.op);
  });
}

function getStatus(num) {
  const its = ITEMS.filter(i => gv(i,"Номер замовлення") === num);
  if (!its.length) return "new";
  const issued = its.filter(i => gv(i,"Статус") === "📦 Виданий").length;
  if (issued === its.length) return "issued";
  if (issued > 0) return "partial";
  if (its.some(i => gv(i,"Статус") === "✅ Готово")) return "ready";
  if (its.some(i => gv(i,"Статус") === "⚙️ В роботі")) return "work";
  if (its.some(i => gv(i,"Статус") === "⏳ Відкладено")) return "postponed";
  return "new";
}
const STATUS_META = {
  new:["Новий","b-new"], work:["В роботі","b-work"], ready:["Готово","b-ready"],
  issued:["Виданий","b-issued"], partial:["Частково видано","b-partial"], postponed:["Відкладено","b-postponed"]
};
const STATUS_ACCENT = { new:"#378ADD", work:"#EF9F27", ready:"#639922", issued:"#B4B2A9", partial:"#2FA98C", postponed:"#E24B4A" };

/* Чи горить термін: термінові — завжди, звичайні — за 3 дні до дати */
function deadlineWarn(o) {
  const term = gv(o,"Термін");
  if (getStatus(gv(o,"Номер замовлення")) === "issued") return false;
  if (term.includes("Терміново")) return true;
  const d = parseDeadline(term);
  if (!d) return false;
  const now = new Date(); now.setHours(0,0,0,0);
  const diff = (d - now) / 86400000;
  return diff >= 0 && diff <= 3;
}
function parseDeadline(str) {
  if (!str) return null;
  const m = str.match(/(\d{1,2})\.(\d{1,2})(?:\.(\d{2,4}))?/);
  if (!m) return null;
  const day = parseInt(m[1]), mon = parseInt(m[2]) - 1;
  let year = m[3] ? parseInt(m[3]) : new Date().getFullYear();
  if (year < 100) year += 2000;
  return new Date(year, mon, day);
}

/* Послуги замовлення одним рядком */
function orderServices(num) {
  const its = ITEMS.filter(i => gv(i,"Номер замовлення") === num);
  const names = [];
  its.forEach(i => {
    (gv(i,"Послуги") || "").split(",").forEach(s => {
      const k = s.trim().split("—")[0].trim();
      if (k && names.indexOf(k) === -1) names.push(k);
    });
  });
  return names.slice(0,3).join(", ") || "—";
}
function pluralUk(n, one, few, many) {
  const a = Math.abs(n) % 100, a1 = a % 10;
  if (a > 10 && a < 20) return many;
  if (a1 > 1 && a1 < 5) return few;
  if (a1 === 1) return one;
  return many;
}
function orderItemName(num) {
  const its = ITEMS.filter(i => gv(i,"Номер замовлення") === num);
  if (!its.length) return "—";
  const first = its[0];
  const t = gv(first,"Тип"), b = gv(first,"Бренд");
  let name = [t, b].filter(Boolean).join(" · ") || "Виріб";
  if (its.length > 1) {
    const extra = its.length - 1;
    name += " +" + extra + " " + pluralUk(extra, "виріб", "вироби", "виробів");
  }
  return name;
}
function orderMaster(num) {
  const its = ITEMS.filter(i => gv(i,"Номер замовлення") === num);
  for (let k = 0; k < its.length; k++) { const m = gv(its[k],"Майстер"); if (m) return m; }
  return "";
}

const CATEGORY_LABELS = { shoes: "Взуття", bags: "Аксесуари" };
let PRICE = {};
let priceLoaded = false;

async function loadPrice() {
  try {
    const url = "https://docs.google.com/spreadsheets/d/" + SHEET_ID + "/gviz/tq?tqx=out:json&gid=" + PRICE_GID;
    const r = await fetch(url);
    const txt = await r.text();
    const json = JSON.parse(txt.substring(txt.indexOf("{"), txt.lastIndexOf("}") + 1));
    PRICE = {};
    // шукаємо колонку "Активна" за назвою в шапці
    let activeIdx = -1;
    let termIdx = -1;
    if (json.table && json.table.cols) {
      json.table.cols.forEach(function(col, i){
        const lbl = String((col && col.label) || "").trim().toLowerCase();
        if (lbl === "активна" || lbl === "активність" || lbl === "active") activeIdx = i;
        if (termIdx === -1 && (lbl.indexOf("термін") !== -1 || lbl.indexOf("строк") !== -1 || lbl.indexOf("срок") !== -1 || lbl.indexOf("виконан") !== -1)) termIdx = i;
      });
    }
    json.table.rows.forEach(function(row){
      const c = row.c; if (!c) return;
      const category = c[0] && c[0].v ? String(c[0].v).trim() : "";
      const deptName = c[2] && c[2].v ? String(c[2].v).trim() : "";
      const svcName  = c[3] && c[3].v ? String(c[3].v).trim() : "";
      const unit     = c[4] && c[4].v ? String(c[4].v).trim() : "";
      const price    = c[5] && c[5].v != null ? parseInt(c[5].v) : 0;
      let active = true;
      if (activeIdx >= 0 && c[activeIdx] && c[activeIdx].v != null) {
        const v = String(c[activeIdx].v).trim().toLowerCase();
        active = !(v === "ні" || v === "no" || v === "false" || v === "0");
      }
      let term = "";
      if (termIdx >= 0 && c[termIdx] && c[termIdx].v != null) term = gvizDate(String(c[termIdx].v).trim());
      if (!category || !deptName || !svcName) return;
      if (!PRICE[category]) PRICE[category] = { label: CATEGORY_LABELS[category] || category, departments: {} };
      if (!PRICE[category].departments[deptName]) PRICE[category].departments[deptName] = [];
      PRICE[category].departments[deptName].push({ name: svcName, price: price, unit: unit, active: active, term: term });
    });
    priceLoaded = true;
    if (["create","settings","pricelist"].includes(currentPage)) renderers[currentPage]();
  } catch(err) { console.error("Price load error:", err); priceLoaded = true; }
}

/* Знайти месенджер клієнта з останнього замовлення */
function clientMessenger(phone) {
  const orders = ORDERS.filter(o => gv(o,"Телефон") === phone && gv(o,"Месенджер"));
  if (!orders.length) return "";
  return gv(orders[orders.length - 1], "Месенджер");
}

/* Автопідстановка клієнта за історією замовлень */
function knownClients() {
  const map = {};
  ORDERS.forEach(o => {
    const phone = gv(o,"Телефон"), name = gv(o,"Ім'я клієнта");
    if (phone && !map[phone]) map[phone] = { name: name, phone: phone };
  });
  TAILOR.forEach(t => {
    const phone = gv(t,"Телефон"), name = gv(t,"Ім'я клієнта");
    if (phone && !map[phone]) map[phone] = { name: name, phone: phone };
  });
  return Object.values(map);
}

function onPhoneInput(v) {

function showClientSuggest(q, field) {
  const dd = document.getElementById("cr-suggest");
  if (!dd) return;
  q = q.trim().toLowerCase();
  if (!q) { dd.classList.remove("open"); return; }
  const matches = knownClients().filter(c =>
    (field === "phone" ? c.phone : c.name).toLowerCase().includes(q)
  ).slice(0, 5);
  if (!matches.length) { dd.classList.remove("open"); return; }
  dd.innerHTML = matches.map(c =>
    "<div class='cr-suggest-opt' onclick=\"pickClient('" + c.phone.replace(/'/g,"") + "')\"><span>" + c.name + "</span><span class='sug-phone'>" + c.phone + "</span></div>"
  ).join("");

function pickClient(phone) {
  const c = knownClients().find(x => x.phone === phone);

  NO.client = c.name; NO.phone = c.phone;
  document.getElementById("cr-client").value = c.name;
  document.getElementById("cr-phone").value = c.phone;
  document.getElementById("cr-suggest").classList.remove("open");

  if (msg) { NO.messenger = msg; renderMsgPick(); }

function toggleOp(id, op) {
  const it = NO.items.find(i=>i.id===id); if (!it) return;
  const idx = it.services.findIndex(s => s.kind === "core" && s.op === op);
  if (idx >= 0) { it.services.splice(idx,1); renderItems(); updateReceipt(); return; }
  if (!it.model) { toast("Спочатку оберіть вид виробу"); return; }
  const p = opPriceFor(it, op);
  if (!p) { toast("Немає ціни для «" + op + "» цього виду/розміру"); return; }
  it.services.push({ kind:"core", op:op, name: coreLineName(it, op), price: parseInt(p.price)||0 });
  renderItems(); updateReceipt();

  renderItems(); updateReceipt();
}

function editSvcPrice(itemId, idx, el) {
  const it = NO.items.find(i=>i.id===itemId);
  if (!it || !it.services[idx]) return;
  const cur = it.services[idx].price;
  const input = document.createElement("input");
  input.type = "number";
  input.className = "ic-svcprice-input";
  input.value = cur;
  const commit = () => {
    const v = parseInt(input.value);
    it.services[idx].price = (!isNaN(v) && v >= 0) ? v : cur;
    renderItems(); updateReceipt();
  };
  input.onblur = commit;
  input.onkeydown = (e) => { if (e.key === "Enter") input.blur(); if (e.key === "Escape") { input.value = cur; input.blur(); } };
  el.replaceWith(input);
  input.focus(); input.select();
}

function renderItemList(){
  const box = document.getElementById("cr-items");
  if (!box) return;
  box.innerHTML = "";
  NO.items.forEach(function(item, idx){
    const sum = itemSum(item);
    const svcNames = (item.services||[]).map(function(s){ return s.name; }).join(" · ");
    const sub = svcNames || "без послуг";
    const div = document.createElement("div");
    div.className = "irow";
    div.setAttribute("onclick", "openItemModal(" + item.id + ")");
    div.innerHTML =
      "<span class='irow-num'>№" + (idx+1) + "</span>" +
      "<div class='irow-main'>" +
        "<div class='irow-name'>" + itemTitle(item) + "</div>" +
        "<div class='irow-sub'>" + sub + "</div>" +
      "</div>" +
      "<span class='irow-sum'>" + (sum ? fmtUAH(sum) : "—") + "</span>" +
      "<button class='irow-edit' onclick='event.stopPropagation();openItemModal(" + item.id + ")'>✎</button>";
    box.appendChild(div);
  });
}

function renderItemEditor(id){
  const item = NO.items.find(function(i){ return i.id === id; });
  if (!item) { closeItemModal(); return; }
  const idx = NO.items.indexOf(item);
  ensureItemModal();
  const title = document.getElementById("iw-title");
  const body  = document.getElementById("iw-body");
  const sumEl = document.getElementById("iw-sum");
  const delBtn= document.getElementById("iw-del");
  if (title) title.innerHTML = "Річ <span>№" + (idx+1) + "</span>";
  if (body)  body.innerHTML  = buildItemBody(item, idx);
  if (sumEl) sumEl.textContent = fmtUAH(itemSum(item));
  if (delBtn) delBtn.setAttribute("onclick", "removeItem(" + item.id + "); closeItemModal();");
}

function openItemModal(id){
  MODAL_ITEM = id;
  ensureItemModal();
  renderItemEditor(id);
  document.getElementById("iw-ovl").classList.add("on");
}
function closeItemModal(){
  MODAL_ITEM = null;
  const ovl = document.getElementById("iw-ovl");
  if (ovl) ovl.classList.remove("on");
  renderItemList();
  updateReceipt();
}

/* Нові кольори з замовлення — дописуємо в лист «Кольори» */
async function saveNewColors(items) {
  const known = new Set(colorList().map(c => c.toLowerCase()));
  const fresh = [];
  items.forEach(it => {
    const c = (it.color || "").trim();
    if (c && !known.has(c.toLowerCase())) { known.add(c.toLowerCase()); fresh.push(c); COLORS.push(c); }
  });
  if (!fresh.length) return;
  try {
    await fetch(API_URL.replace("/order","/colors/add"), {
      method: "POST", mode: "cors", headers: {"Content-Type":"application/json"},
      body: JSON.stringify({ colors: fresh })
    });
  } catch(e) { console.error("colors add failed", e); }
}

/* Нові бренди з замовлення — дописуємо в лист «Бренди» */
async function saveNewBrands(items) {
  const known = new Set(BRANDS.map(b => b.toLowerCase()));
  const fresh = [];
  items.forEach(it => {
    const b = (it.brand || "").trim();
    if (b && !known.has(b.toLowerCase())) { known.add(b.toLowerCase()); fresh.push(b); BRANDS.push(b); }
  });
  if (!fresh.length) return;
  try {
    await fetch(API_URL.replace("/order","/brands/add"), {
      method: "POST", mode: "cors", headers: {"Content-Type":"application/json"},
      body: JSON.stringify({ brands: fresh })
    });
  } catch(e) { console.error("brands add failed", e); }
}

async function submitOrder() {  if (!NO.manager) { alert("Оберіть приймальника"); return; }
  NO.client = document.getElementById("cr-client").value.trim();
  NO.phone = document.getElementById("cr-phone").value.trim();
  if (!NO.client) { alert("Введіть ім'я клієнта"); return; }
  if (!NO.phone) { alert("Введіть телефон"); return; }
  const validItems = NO.items.filter(i => i.services.length > 0);
  if (!validItems.length) { alert("Додайте хоча б одну послугу"); return; }
  if (!NO.payment) { alert("Оберіть тип оплати"); return; }
  if (!NO.deadline) { alert("Вкажіть термін"); return; }
  let paymentStr = NO.payment;
  if (NO.payment === "Передплата" && NO.prepay) paymentStr = "Передплата: " + parseInt(NO.prepay).toLocaleString("uk-UA") + " ₴";

  const now = new Date();
  const pad = n => String(n).padStart(2,"0");
  const dateStr = pad(now.getDate())+"."+pad(now.getMonth()+1)+"."+now.getFullYear()+" "+pad(now.getHours())+":"+pad(now.getMinutes());

  const payload = {
    date: dateStr, manager: NO.manager, client: NO.client, phone: NO.phone,
    payment: paymentStr, deadline: NO.deadline, messenger: NO.messenger || "",
    delivery: NO.delivery || "Самовивіз",
    prepayMethod: NO.payment === "Передплата" ? (NO.prepayMethod || "") : "",
    prepay: NO.payment === "Передплата" && NO.prepay ? parseInt(NO.prepay) : 0,
    items: validItems.map(item => {
      const total = item.services.reduce((s,x)=>s+x.price,0);
      const catLabel = PRICE[item.category] ? PRICE[item.category].label : item.category;
      return {
        type: item.model || catLabel,
        brand: item.brand || "",
        services: item.services.map(s=>s.name).join(", "),
        total: total.toLocaleString("uk-UA") + " ₴",
        color: item.color || "",
        material: item.matNote || "",
        condition: item.condition || "",
        note: item.note || ""
      };
    })
  };

  const btn = document.querySelector(".cr-create-btn");
  btn.textContent = "Збереження...";
  btn.disabled = true;
  try {
    const res = await fetch(API_URL, { method:"POST", mode:"cors", headers:{"Content-Type":"application/json"}, body: JSON.stringify(payload) });
    const result = await res.json();
    if (result.status === "ok") {
      btn.textContent = "✓ " + (result.order_num || "Збережено");
      saveNewBrands(validItems);
      saveNewColors(validItems);
      try { localStorage.removeItem("rw_draft"); } catch(e) {}
      NO = { manager: NO.manager, client:"", phone:"", messenger:"", items:[], payment:"", prepay:"", prepayMethod:"", deadline:"", delivery:"Самовивіз" };
      itemCounter = 0;
      setTimeout(() => { loadData(); showPage("orders"); }, 1200);
    } else {
      alert("Помилка: " + result.message); btn.textContent = "Створити замовлення"; btn.disabled = false;
    }
  } catch(e) {
    alert("Помилка збереження: " + e.message); btn.textContent = "Створити замовлення"; btn.disabled = false;
  }
}

  ["all","Всі"], ["new","Нові"], ["work","В роботі"], ["ready","Готові"], ["issued","Видані"]
];
const PAY_FILTER_DEFS = [
  ["all","Всі"], ["paid","Оплачені"], ["unpaid","Не оплачені"]
];

renderers.orders = function() {
  const page = document.getElementById("page-orders");

  const periodOrders = ordersInPeriod(periodSel.orders);
  const counts = { all: periodOrders.length, new:0, work:0, ready:0, issued:0 };
  periodOrders.forEach(o => {
    const st = getStatus(gv(o,"Номер замовлення"));
    if (counts[st] !== undefined) counts[st]++;
  });
  const activeCount = periodOrders.filter(o => getStatus(gv(o,"Номер замовлення")) !== "issued").length;
  const periodNums = new Set(periodOrders.map(o => gv(o,"Номер замовлення")));
  const itemsInWork = ITEMS.filter(i => periodNums.has(gv(i,"Номер замовлення")) && gv(i,"Статус") === "⚙️ В роботі").length;

  const tabs = FILTER_DEFS.map(([k,label]) => {
    const active = k === "all" ? ordersFilter.size === 0 : ordersFilter.has(k);
    return "<button class='ftab" + (active ? " active" : "") + "' onclick=\"setOrdersFilter('" + k + "')\">" +
      label + "<b>" + (counts[k] || 0) + "</b></button>";
  }).join("");

  const payCounts = { all: periodOrders.length, paid: 0, unpaid: 0 };
  periodOrders.forEach(o => {
    const num = gv(o,"Номер замовлення");
    if (isOrderPaid(num)) payCounts.paid++; else payCounts.unpaid++;
  });
  const payTabs = PAY_FILTER_DEFS.map(([k,label]) =>
    "<button class='ftab" + (ordersPayFilter === k ? " active" : "") + "' onclick=\"setOrdersPayFilter('" + k + "')\">" +
    label + "<b>" + (payCounts[k] || 0) + "</b></button>"
  ).join("");

  page.innerHTML =

      "<div class='page-title'>Замовлення на ремонт</div>" +
      "<button class='btn-primary' onclick=\"showPage('create')\"><svg viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-linecap='round' stroke-linejoin='round'><line x1='12' y1='5' x2='12' y2='19'/><line x1='5' y1='12' x2='19' y2='12'/></svg>Нове замовлення</button>" +
    "</div>" +
    "<div class='stat-cards'>" +
      statCard("Активних замовлень", activeCount, true) +
      statCard("Виробів в роботі", itemsInWork) +
      statCard("Готові до видачі", counts.ready) +
      statCard("Видано замовлень", counts.issued) +
    "</div>" +
    periodTabsHTML("orders") +
    "<div class='filters'>" + tabs +
      "<div class='filters-right'><div class='search-box'>" +
        "<svg viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-linecap='round' stroke-linejoin='round'><circle cx='11' cy='11' r='8'/><line x1='21' y1='21' x2='16.65' y2='16.65'/></svg>" +
        "<input type='text' placeholder='Пошук...' value=\"" + ordersSearch.replace(/"/g,"&quot;") + "\" oninput='onOrdersSearch(this.value)'></div></div>" +
    "</div>" +
    "<div class='filters filters-secondary'>" + payTabs + "</div>" +
    "<div class='orders-scroll' id='orders-scroll'></div>";

function setOrdersFilter(k) {
  if (k === "all") { ordersFilter.clear(); }
  else if (ordersFilter.has(k)) { ordersFilter.delete(k); }
  else { ordersFilter.add(k); }
  renderers.orders();
}
function setOrdersPayFilter(k) { ordersPayFilter = k; renderers.orders(); }
function onOrdersSearch(v) { ordersSearch = v; renderOrdersList(); }

function renderOrdersList() {
  const box = document.getElementById("orders-scroll");
  if (!box) return;

  if (!dataLoaded) { box.innerHTML = "<div class='orders-loading'>Завантаження...</div>"; return; }

  const q = ordersSearch.trim().toLowerCase();
  const filtered = ordersInPeriod(periodSel.orders).filter(o => {
    const num = gv(o,"Номер замовлення");
    const stOk = ordersFilter.size === 0 || ordersFilter.has(getStatus(num));
    const payOk = ordersPayFilter === "all" ||
      (ordersPayFilter === "paid" ? isOrderPaid(num) : !isOrderPaid(num));
    const qOk = !q ||
      gv(o,"Ім'я клієнта").toLowerCase().includes(q) ||
      num.toLowerCase().includes(q) ||
      gv(o,"Телефон").includes(q);
    return stOk && payOk && qOk;
  }).reverse();

  if (!filtered.length) {
    box.innerHTML = "<div class='orders-empty'>Немає замовлень</div>";
    return;
  }

  const rowHTML = (o) => {
    const num = gv(o,"Номер замовлення");
    const warn = deadlineWarn(o);
    const term = gv(o,"Термін") || "—";
    const imp = isImportant(num);
    const flagSvg = "<svg viewBox='0 0 24 24' fill='" + (imp?"currentColor":"none") + "' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M4 21V4h13l-2 4 2 4H4'/></svg>";
    const master = orderMaster(num);
    const total = orderTotal(num);
    const paid = isOrderPaid(num);
    const payBadge = total > 0 ? "<span class='olr-pay-badge" + (paid ? " paid" : " unpaid") + "'>" + (paid ? "Оплачено" : "Не оплачено") + "</span>" : "";
    const st0 = getStatus(num);
    let notifyBadge = "";
    if (st0 === "ready" || st0 === "issued") {
      const orderItems = ITEMS.filter(i => gv(i,"Номер замовлення") === num);
      const allNotified = orderItems.length > 0 && orderItems.every(i => gv(i,"Сповіщено"));
      notifyBadge = allNotified
        ? "<span class='olr-notify-ico ok' title='Клієнта сповіщено'><svg viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'><path d='M20 6L9 17l-5-5'/></svg></span>"
        : "<span class='olr-notify-ico warn' title='Клієнта ще не сповіщено'>⚠ Сповістити</span>";
    }
    return "<div class='olr" + (warn ? " urgent-soon" : "") + (imp ? " important" : "") + "' data-num=\"" + num + "\" onclick=\"openOrder('" + num + "')\" oncontextmenu=\"toggleImportant('" + num + "',event);return false\">" +
      "<div class='olr-1'>" +
        "<span class='olr-num'>" + num + "</span>" +
        "<span class='olr-item'>" + orderItemName(num) + "</span>" +
        "<span class='olr-badge'>" + statusBadge(num) + "</span>" +
        payBadge +
        notifyBadge +
        "<button class='ocard-flag" + (imp?" on":"") + "' onclick=\"toggleImportant('" + num + "',event)\" aria-label='Важливо'>" + flagSvg + "</button>" +
      "</div>" +
      "<div class='olr-2'>" +
        "<span class='olr-client'><span class='nm'>" + (gv(o,"Ім'я клієнта") || "—") + "</span> <span class='ph'>" + gv(o,"Телефон") + "</span></span>" +
        "<span class='olr-mt" + (warn ? " warn" : "") + "'>" + (master ? master + " · " : "") + term + "</span>" +
      "</div>" +
    "</div>";
  };
  const half = Math.ceil(filtered.length / 2);
  const leftHtml = filtered.slice(0, half).map(rowHTML).join("");
  const rightHtml = filtered.slice(half).map(rowHTML).join("");
  box.innerHTML = "<div class='orders-2col'>" +
    "<div class='olcol'>" + leftHtml + "</div>" +
    (rightHtml ? "<div class='olcol'>" + rightHtml + "</div>" : "") +
  "</div>";
  bindOrderLongPress();
}

/* Важливі замовлення — локальна позначка (це пристрій) */
function importantSet() {
  try { return new Set(JSON.parse(localStorage.getItem("rw_important") || "[]")); } catch(e) { return new Set(); }
}
function isImportant(num) { return importantSet().has(num); }
function toggleImportant(num, ev) {
  if (ev) { ev.stopPropagation(); ev.preventDefault(); }
  const s = importantSet();
  if (s.has(num)) s.delete(num); else s.add(num);
  try { localStorage.setItem("rw_important", JSON.stringify([...s])); } catch(e) {}
  renderOrdersList();
}
let _lpSuppressClick = false;
function bindOrderLongPress() {
  document.querySelectorAll("#orders-scroll .order-card").forEach(el => {
    const num = el.getAttribute("data-num");
    let timer = null;
    el.addEventListener("touchstart", () => {
      timer = setTimeout(() => {
        timer = null; _lpSuppressClick = true;
        toggleImportant(num);
        if (navigator.vibrate) navigator.vibrate(18);
      }, 500);
    }, { passive: true });
    const cancel = () => { if (timer) { clearTimeout(timer); timer = null; } };
    el.addEventListener("touchend", cancel);
    el.addEventListener("touchmove", cancel);
    el.addEventListener("click", e => {
      if (_lpSuppressClick) { e.stopImmediatePropagation(); e.preventDefault(); _lpSuppressClick = false; }
    }, true);
  });
}

/* ═══════════════ ПЕРІОД (спільний для вкладок) ═══════════════ */
let periodSel = { clients: "all", finance: "month", stats: "month", orders: "all" };
const PERIODS = [["week","Тиждень"],["month","Місяць"],["year","Рік"],["all","Весь час"]];
function periodStart(key) {
  const now = new Date();
  if (key === "week") { const d = new Date(now); d.setDate(d.getDate()-7); return d; }
  if (key === "month") { const d = new Date(now); d.setMonth(d.getMonth()-1); return d; }
  if (key === "year") { const d = new Date(now); d.setFullYear(d.getFullYear()-1); return d; }
  return null;
}
function orderDate(o) {
  const s = gv(o,"Дата створення");
  const m = s.match(/(\d{1,2})\.(\d{1,2})\.(\d{4})/);
  if (!m) return null;
  return new Date(parseInt(m[3]), parseInt(m[2])-1, parseInt(m[1]));
}
const DELETED_MARKER = "[ВИДАЛЕНО] ";
function isOrderDeleted(o) { return gv(o,"Примітка").indexOf(DELETED_MARKER) === 0; }
function orderNoteClean(o) {
  const n = gv(o,"Примітка");
  return isOrderDeleted(o) ? n.slice(DELETED_MARKER.length) : n;
}
function ordersInPeriod(key) {
  const from = periodStart(key);
  const base = ORDERS.filter(o => !isOrderDeleted(o));
  if (!from) return base;
  return base.filter(o => { const d = orderDate(o); return d && d >= from; });
}
function tailorInPeriod(key) {
  const from = periodStart(key);
  if (!from) return TAILOR.slice();
  return TAILOR.filter(t => {
    const s = gv(t,"Дата створення");
    const m = s.match(/(\d{1,2})\.(\d{1,2})\.(\d{4})/);
    if (!m) return false;
    const d = new Date(parseInt(m[3]), parseInt(m[2])-1, parseInt(m[1]));
    return d >= from;
  });
}

function orderTotal(num) {
  return ITEMS.filter(i => gv(i,"Номер замовлення") === num)
    .reduce((s,it) => s + extractAmt(gv(it,"Сума")), 0);
}
function isOrderPaid(num) {
  const o = ORDERS.find(x => gv(x,"Номер замовлення") === num);
  if (!o) return false;
  const total = orderTotal(num);
  const payStr = gv(o,"Оплата");
  const prepayAmt = extractAmt(payStr);
  const settleAmt = extractAmt(gv(o,"Сума доплати"));
  return computePayStatus(total, payStr, prepayAmt, settleAmt).isPaid;
}

async function restoreOrder(num) {
  try {
    const res = await fetch(API_URL.replace("/order","/order/restore"), {
      method: "POST", mode: "cors", headers: {"Content-Type":"application/json"},
      body: JSON.stringify({ order_num: num })
    });
    const r = await res.json();
    if (r.status !== "ok") throw new Error(r.message || "error");
  } catch(e) {
    toast("Не вдалося відновити замовлення");
    return;
  }
  await loadData();
  renderers.archive();
  toast("Замовлення " + num + " відновлено");
}
function periodTabsHTML(tabKey) {
  return "<div class='period-tabs'>" + PERIODS.map(([k,label]) =>
    "<button class='ptab" + (periodSel[tabKey]===k?" active":"") + "' onclick=\"setPeriod('" + tabKey + "','" + k + "')\">" + label + "</button>"
  ).join("") + "</div>";
}
function setPeriod(tabKey, val) { periodSel[tabKey] = val; renderers[tabKey](); }
const barsExpanded = {};
function barsHTML(data, unit, panelId) {
  const max = Math.max(1, ...data.map(d => d[1]));
  const total = data.reduce((s,d) => s + d[1], 0) || 1;
  const expanded = panelId ? !!barsExpanded[panelId] : true;
  const limit = expanded ? 15 : 5;
  const shown = data.slice(0, limit);
  const rows = shown.map(d => {
    const pct = Math.round(d[1] / total * 100);
    const w = Math.round(d[1] / max * 100);
    const valStr = unit === "₴" ? d[1].toLocaleString("uk-UA") + " ₴" : d[1];
    return "<div class='bar-item'>" +
      "<div class='bar-head'><span class='bar-name'>" + d[0] + "</span>" +
      "<span class='bar-meta'>" + pct + "% · " + valStr + "</span></div>" +
      "<div class='bar-track'><div class='bar-fill' style='width:" + w + "%'></div></div>" +
    "</div>";
  }).join("");
  const canToggle = panelId && data.length > 5;
  const toggleBtn = canToggle ?
    "<button class='bars-toggle' onclick=\"toggleBarsExpand('" + panelId + "')\">" +
      (expanded ? "Згорнути" : "Показати ще (" + Math.min(data.length, 15) + ")") +
    "</button>" : "";
  return rows + toggleBtn;
}
function toggleBarsExpand(panelId) {
  barsExpanded[panelId] = !barsExpanded[panelId];
  if (renderers[currentPage]) renderers[currentPage]();
}
