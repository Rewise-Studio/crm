/* ═══════════════ ВКЛАДКА ФІНАНСИ ═══════════════ */
renderers.finance = function() {
  const page = document.getElementById("page-finance");
  const orders = ordersInPeriod(periodSel.finance);

  let revenue = 0, prepaySum = 0, settleSum = 0;
  const byMethod = { "Готівка": 0, "Картка": 0, "ФОП": 0 };
  orders.forEach(o => {
    const num = gv(o,"Номер замовлення");
    revenue += orderTotal(num);
    const pAmt = extractAmt(gv(o,"Оплата"));
    const pM = gv(o,"Спосіб передоплати");
    if (isPrepayStr(gv(o,"Оплата")) && pAmt) { prepaySum += pAmt; if (byMethod[pM] !== undefined) byMethod[pM] += pAmt; }
    const sAmt = extractAmt(gv(o,"Сума доплати"));
    const sM = gv(o,"Спосіб доплати");
    if (sAmt) { settleSum += sAmt; if (byMethod[sM] !== undefined) byMethod[sM] += sAmt; }
  });
  const avg = orders.length ? Math.round(revenue / orders.length) : 0;
  const collected = prepaySum + settleSum;

  // Індпошив за той самий період
  const tailorList = tailorInPeriod(periodSel.finance);
  let tailorRevenue = 0;
  tailorList.forEach(t => {
    tailorRevenue += extractAmt(gv(t,"Вартість"));
    const pAmt = extractAmt(gv(t,"Оплата"));
    const pM = gv(t,"Спосіб передоплати");
    if (isPrepayStr(gv(t,"Оплата")) && pAmt && byMethod[pM] !== undefined) byMethod[pM] += pAmt;
    const sAmt = extractAmt(gv(t,"Сума доплати"));
    const sM = gv(t,"Спосіб доплати");
    if (sAmt && byMethod[sM] !== undefined) byMethod[sM] += sAmt;
  });
  const totalRevenue = revenue + tailorRevenue;
  const totalCount = orders.length + tailorList.length;
  const totalAvg = totalCount ? Math.round(totalRevenue / totalCount) : 0;

  page.innerHTML =
    groupSwitcher("analytics") +
    "<div class='page-header'><div class='page-title'>Фінанси</div></div>" +
    "<div class='tab-scroll'>" +
      periodTabsHTML("finance") +
      "<div class='stat-cards'>" +
        statCard("Загальний обіг", totalRevenue.toLocaleString("uk-UA") + " ₴", true) +
        statCard("Середній чек", totalAvg.toLocaleString("uk-UA") + " ₴") +
        statCard("Отримано коштів", collected.toLocaleString("uk-UA") + " ₴") +
        statCard("Замовлень", totalCount) +
      "</div>" +
      "<div class='stat-panel'><div class='stat-panel-label'>Обіг за напрямками</div>" +
        "<div class='pay-split'>" +
          paySplit("Ремонт (" + orders.length + ")", revenue) +
          paySplit("Виготовлення (" + tailorList.length + ")", tailorRevenue) +
        "</div>" +
      "</div>" +
      "<div class='stat-panel'><div class='stat-panel-label'>Надходження за способом оплати</div>" +
        "<div class='pay-split'>" +
          paySplit("Готівка", byMethod["Готівка"]) +
          paySplit("Картка", byMethod["Картка"]) +
          paySplit("ФОП", byMethod["ФОП"]) +
        "</div>" +
      "</div>" +
    "</div>";
};
function statCard(label, value, accent) {
  return "<div class='stat-card'><div class='sc-label'>" + label + "</div><div class='sc-value" + (accent?" accent":"") + "'>" + value + "</div></div>";
}
function paySplit(label, val) {
  return "<div class='pay-split-item'><div class='ps-label'>" + label + "</div><div class='ps-value'>" + (val||0).toLocaleString("uk-UA") + " ₴</div></div>";
}

/* ═══════════════ ВКЛАДКА СТАТИСТИКА ═══════════════ */
renderers.stats = function() {
  const page = document.getElementById("page-stats");
  const orders = ordersInPeriod(periodSel.stats);
  const orderNums = new Set(orders.map(o => gv(o,"Номер замовлення")));
  const tailorList = tailorInPeriod(periodSel.stats);

  // Клієнти — ремонт + пошив
  const phones = {};
  orders.forEach(o => { const p = gv(o,"Телефон"); if (p) phones[p] = (phones[p]||0)+1; });
  tailorList.forEach(t => { const p = gv(t,"Телефон"); if (p) phones[p] = (phones[p]||0)+1; });
  const totalClients = Object.keys(phones).length;
  const repeat = Object.values(phones).filter(c => c > 1).length;

  // Топ послуг
  const svcCount = {};
  ITEMS.filter(i => orderNums.has(gv(i,"Номер замовлення"))).forEach(it => {
    (gv(it,"Послуги")||"").split(",").forEach(s => {
      const k = s.trim().split("—")[0].trim();
      if (k) svcCount[k] = (svcCount[k]||0)+1;
    });
  });
  const topSvc = Object.entries(svcCount).sort((a,b)=>b[1]-a[1]).map(e=>[e[0],e[1]]);

  // По приймальниках (оборот)
  const byMgr = {};
  orders.forEach(o => { const m = gv(o,"Приймальник")||"—"; byMgr[m] = (byMgr[m]||0) + orderTotal(gv(o,"Номер замовлення")); });
  const mgrData = Object.entries(byMgr).sort((a,b)=>b[1]-a[1]).map(e=>[e[0],e[1]]);

  // Топ клієнтів (за сумою або кількістю — перемикач)
  const clientAgg = {};
  orders.forEach(o => {
    const phone = gv(o,"Телефон"); if (!phone) return;
    const name = gv(o,"Ім'я клієнта") || phone;
    if (!clientAgg[phone]) clientAgg[phone] = { name, sum: 0, count: 0 };
    clientAgg[phone].sum += orderTotal(gv(o,"Номер замовлення"));
    clientAgg[phone].count += 1;
  });
  tailorList.forEach(t => {
    const phone = gv(t,"Телефон"); if (!phone) return;
    const name = gv(t,"Ім'я клієнта") || phone;
    if (!clientAgg[phone]) clientAgg[phone] = { name, sum: 0, count: 0 };
    clientAgg[phone].sum += extractAmt(gv(t,"Вартість"));
    clientAgg[phone].count += 1;
  });
  const clientList = Object.values(clientAgg);
  const topClientsBySum = [...clientList].sort((a,b)=>b.sum-a.sum).map(c=>[c.name, c.sum]);
  const topClientsByCount = [...clientList].sort((a,b)=>b.count-a.count).map(c=>[c.name, c.count]);
  window._topClientsBySum = topClientsBySum;
  window._topClientsByCount = topClientsByCount;

  page.innerHTML =
    groupSwitcher("analytics") +
    "<div class='page-header'><div class='page-title'>Статистика</div></div>" +
    "<div class='tab-scroll'>" +
      periodTabsHTML("stats") +
      "<div class='stat-cards'>" +
        statCard("Замовлень", (orders.length + tailorList.length) + (tailorList.length ? " (" + orders.length + "+" + tailorList.length + ")" : "")) +
        statCard("Клієнтів", totalClients) +
        statCard("Повторних", repeat) +
        statCard("Виробів", ITEMS.filter(i=>orderNums.has(gv(i,"Номер замовлення"))).length) +
      "</div>" +
      punctualityPanel(orders) +
      "<div class='stat-cols'>" +
        "<div class='stat-panel'><div class='stat-panel-label'>Топ послуг</div>" + (topSvc.length ? barsHTML(topSvc, "", "svc") : "<div style='color:var(--txt-3);font-size:12px'>Немає даних</div>") + "</div>" +
        "<div class='stat-panel'>" +
          "<div class='stat-panel-head'><div class='stat-panel-label' style='margin:0'>Топ клієнтів</div>" +
            "<div class='mini-toggle'>" +
              "<button class='mt-btn" + (topClientsMode==="sum"?" active":"") + "' id='tc-sum-btn' onclick='setTopClientsMode(\"sum\")'>За сумою</button>" +
              "<button class='mt-btn" + (topClientsMode==="count"?" active":"") + "' id='tc-count-btn' onclick='setTopClientsMode(\"count\")'>За кількістю</button>" +
            "</div></div>" +
          "<div id='top-clients-bars'>" + ((topClientsMode==="sum"?topClientsBySum:topClientsByCount).length ? barsHTML(topClientsMode==="sum"?topClientsBySum:topClientsByCount, topClientsMode==="sum"?"₴":"", "clients") : "<div style='color:var(--txt-3);font-size:12px'>Немає даних</div>") + "</div>" +
        "</div>" +
        "<div class='stat-panel'><div class='stat-panel-label'>По приймальниках</div>" + (mgrData.length ? barsHTML(mgrData, "₴", "mgr") : "<div style='color:var(--txt-3);font-size:12px'>Немає даних</div>") + "</div>" +
      "</div>" +
    "</div>";
};

let topClientsMode = "sum";
function setTopClientsMode(mode) {
  topClientsMode = mode;
  const box = document.getElementById("top-clients-bars");
  const data = mode === "sum" ? window._topClientsBySum : window._topClientsByCount;
  box.innerHTML = data.length ? barsHTML(data, mode === "sum" ? "₴" : "", "clients") : "<div style='color:var(--txt-3);font-size:12px'>Немає даних</div>";
  document.getElementById("tc-sum-btn").classList.toggle("active", mode === "sum");
  document.getElementById("tc-count-btn").classList.toggle("active", mode === "count");
}

let editState = null;

function openEditOrder(num) {
  if (!isAdmin()) { toast("Редагування доступне лише адміністратору"); return; }
  const o = ORDERS.find(x => gv(x,"Номер замовлення") === num);
  if (!o) return;
  const its = ITEMS.filter(i => gv(i,"Номер замовлення") === num);
  // Розбираємо послуги виробів у редаговану структуру
  editState = {
    num: num,
    client: gv(o,"Ім'я клієнта"),
    phone: gv(o,"Телефон"),
    messenger: gv(o,"Месенджер"),
    payment: isPrepayStr(gv(o,"Оплата")) ? "Передплата" : (gv(o,"Оплata") || gv(o,"Оплата") || ""),
    deadline: gv(o,"Термін"),
    items: its.map((it, idx) => ({
      type: gv(it,"Тип"),
      brand: gv(it,"Бренд"),
      servicesRaw: gv(it,"Послуги"),
      total: extractAmt(gv(it,"Сума"))
    }))
  };
  renderEditForm();
}

function renderEditForm() {
  const body = document.getElementById("odm-body");
  const e = editState;
  const itemsHTML = e.items.map((it, idx) =>
    "<div class='edit-item'>" +
      "<div class='edit-item-head'><span class='itemcard-num'>№" + (idx+1) + "</span>" +
        "<button class='itemcard-rm' onclick='editRemoveItem(" + idx + ")'>×</button></div>" +
      "<div class='ic-row'><div class='ic-field'><label>ТИП</label><input class='ic-mini' value=\"" + it.type.replace(/"/g,"&quot;") + "\" oninput='editState.items[" + idx + "].type=this.value'></div>" +
      "<div class='ic-field'><label>БРЕНД</label><input class='ic-mini' value=\"" + it.brand.replace(/"/g,"&quot;") + "\" oninput='editState.items[" + idx + "].brand=this.value'></div></div>" +
      "<div class='ic-row'><div class='ic-field'><label>ПОСЛУГИ</label><input class='ic-mini' value=\"" + it.servicesRaw.replace(/"/g,"&quot;") + "\" oninput='editState.items[" + idx + "].servicesRaw=this.value'></div>" +
      "<div class='ic-field' style='max-width:110px'><label>СУМА ₴</label><input class='ic-mini' type='number' value='" + it.total + "' oninput='editState.items[" + idx + "].total=parseInt(this.value)||0'></div></div>" +
    "</div>"
  ).join("");

  const msgPick = ["telegram","whatsapp","viber"].map(m => {
    const active = e.messenger === m;
    const style = active ? " style='background:" + MSG_COLORS[m] + "'" : "";
    return "<button class='cr-msg-btn" + (active?" active":"") + "'" + style + " onclick=\"editSetMsg('" + m + "')\"><span class='msg-ico'" + (active?" style='color:#fff'":"") + ">" + MSG_ICONS[m] + "</span>" + MSG_LABELS[m] + "</button>";
  }).join("");

  body.innerHTML =
    "<div class='detail-top'><span class='detail-title'>Редагування " + e.num + "</span></div>" +
    "<div class='edit-form'>" +
      "<div class='cr-block-label first'>Клієнт</div>" +
      "<input class='cr-input' id='edit-client' value=\"" + e.client.replace(/"/g,"&quot;") + "\" oninput='editState.client=this.value'>" +
      "<input class='cr-input' id='edit-phone' value=\"" + e.phone + "\" oninput='editState.phone=this.value'>" +
      "<div class='cr-msg-pick' id='edit-msg'>" + msgPick + "</div>" +
      "<div class='cr-block-label'>Термін</div>" +
      "<input class='cr-input' id='edit-deadline' value=\"" + e.deadline.replace(/"/g,"&quot;") + "\" oninput='editState.deadline=this.value'>" +
      "<div class='cr-block-label'>Вироби та послуги</div>" +
      itemsHTML +
      "<button class='add-item-btn' onclick='editAddItem()'>+ Додати виріб</button>" +
      "<div style='display:flex;gap:10px;margin-top:24px'>" +
        "<button class='cr-btn' onclick=\"openOrder('" + e.num + "')\" style='flex:1;background:none;border:1px solid var(--field-border);border-radius:8px;color:var(--txt-2);padding:13px;cursor:pointer;font-family:Commissioner,sans-serif;font-size:13px'>Скасувати</button>" +
        "<button class='cr-create-btn' style='flex:2;margin-top:0' onclick='saveEditOrder()'>Зберегти зміни</button>" +
      "</div>" +
    "</div>";
}

function editSetMsg(m) { editState.messenger = (editState.messenger === m) ? "" : m; renderEditForm(); }
function editRemoveItem(idx) { editState.items.splice(idx,1); renderEditForm(); }
function editAddItem() { editState.items.push({ type:"", brand:"", servicesRaw:"", total:0 }); renderEditForm(); }

async function saveEditOrder() {
  const e = editState;
  if (!e.client.trim()) { alert("Введіть ім'я клієнта"); return; }
  if (!e.phone.trim()) { alert("Введіть телефон"); return; }
  // Оновлюємо локально
  const o = ORDERS.find(x => gv(x,"Номер замовлення") === e.num);
  if (o) {
    o["Ім'я клієнта"] = e.client; o["Телефон"] = e.phone;
    o["Месенджер"] = e.messenger; o["Термін"] = e.deadline;
  }
  // Оновлюємо вироби локально
  ITEMS = ITEMS.filter(i => gv(i,"Номер замовлення") !== e.num);
  e.items.forEach((it, idx) => {
    ITEMS.push({
      "Номер замовлення": e.num, "Номер виробу": e.num + "-" + (idx+1),
      "Тип": it.type, "Бренд": it.brand, "Послуги": it.servicesRaw,
      "Сума": it.total.toLocaleString("uk-UA") + " ₴", "Статус": "🆕 Новий",
      "Дата прийому":"","Дата в роботі":"","Дата готово":"","Дата видачі":"","Сповіщено":""
    });
  });
  openOrder(e.num);
  // Зберігаємо на сервер
  try {
    await fetch(API_URL.replace("/order","/order/update"), {
      method: "POST", mode: "cors", headers: {"Content-Type":"application/json"},
      body: JSON.stringify({ order_num: e.num, client: e.client, phone: e.phone, messenger: e.messenger, deadline: e.deadline })
    });
    await fetch(API_URL.replace("/order","/items/update"), {
      method: "POST", mode: "cors", headers: {"Content-Type":"application/json"},
      body: JSON.stringify({ order_num: e.num, items: e.items.map(it => ({ type: it.type, brand: it.brand, services: it.servicesRaw, total: it.total.toLocaleString("uk-UA") + " ₴" })) })
    });
    toast("Зміни збережено");
  } catch(err) { console.error("edit save failed", err); }
}

// Вкладка прайсу винесено у js/pricelist.js (підключено наприкінці, після основного коду)

/* ═══════════════ ВКЛАДКА НАЛАШТУВАННЯ ═══════════════ */
let settingsSection = "params"; // params | price
let priceOpenCat = "";

renderers.settings = function() {
  const page = document.getElementById("page-settings");
  if (!isAdmin()) {
    page.innerHTML = "<div class='page-header'><div class='page-title'>Налаштування</div></div>" +
      "<div class='orders-empty'>Розділ доступний лише адміністратору</div>";
    return;
  }

  const tabs =
    "<div class='filters'>" +
      "<button class='ftab" + (settingsSection==="params"?" active":"") + "' onclick=\"setSettingsSection('params')\">Параметри</button>" +
      "<button class='ftab" + (settingsSection==="price"?" active":"") + "' onclick=\"setSettingsSection('price')\">Прайс</button>" +
    "</div>";

  page.innerHTML =
    "<div class='page-header'><div class='page-title'>Налаштування</div></div>" +
    tabs +
    "<div class='tab-scroll' id='settings-body'></div>";

  if (settingsSection === "price") renderPriceEditor();
  else renderParamsEditor();
};
function setSettingsSection(s) { settingsSection = s; renderers.settings(); }

function renderPriceEditor() {
  const box = document.getElementById("settings-body");
  if (!box) return;
  if (!priceLoaded) { box.innerHTML = "<div class='orders-loading'>Завантаження прайсу...</div>"; return; }

  const cats = Object.keys(PRICE);
  if (!cats.length) { box.innerHTML = "<div class='orders-empty'>Прайс порожній</div>"; return; }
  if (!priceOpenCat || !PRICE[priceOpenCat]) priceOpenCat = cats[0];

  const catTabs = "<div class='cr-pills' style='margin-bottom:16px'>" + cats.map(k =>
    "<button class='cr-pill" + (priceOpenCat===k?" active":"") + "' onclick=\"setPriceCat('" + k + "')\">" + PRICE[k].label + "</button>"
  ).join("") + "</div>";

  const cat = PRICE[priceOpenCat];
  const depts = Object.keys(cat.departments);

  const body = depts.map(dept => {
    const dEsc = dept.replace(/'/g,"\\'");
    const id = hashId(priceOpenCat + dept);

    const rows = cat.departments[dept].map(s => {
      const sName = s.name.replace(/'/g,"\\'");
      const pKey = "p|" + priceOpenCat + "|" + dept + "|" + s.name;
      const aKey = "a|" + priceOpenCat + "|" + dept + "|" + s.name;
      const tKey = "t|" + priceOpenCat + "|" + dept + "|" + s.name;
      const pend = pendingPrice[pKey];
      const aPend = pendingPrice[aKey];
      const tPend = pendingPrice[tKey];
      const shownActive = aPend ? aPend.newValue : (s.active !== false);
      const shownPrice = pend ? pend.newValue : s.price;
      const shownTerm = tPend ? tPend.newValue : (s.term || "");

      return "<div class='price-row" + (shownActive ? "" : " hidden-row") + (pend || aPend || tPend ? " pending" : "") + "'>" +
        "<span class='price-name'>" + s.name +
          (shownActive ? "" : " <span class='price-hidden-tag'>приховано</span>") +
          (pend ? " <span class='price-was'>було " + s.price + " ₴</span>" : "") +
        "</span>" +
        "<span class='price-unit'>" + (s.unit || "") + "</span>" +
        "<input class='price-input' type='number' value='" + shownPrice + "' " +
          "onchange=\"stagePrice('" + priceOpenCat + "','" + dEsc + "','" + sName + "',this.value)\">" +
        "<input class='price-input' type='number' value='" + shownTerm + "' placeholder='дн' title='Термін, днів' " +
          "onchange=\"stageTerm('" + priceOpenCat + "','" + dEsc + "','" + sName + "',this.value)\">" +
        "<button class='price-btn' title='" + (shownActive?"Приховати":"Показати") + "' " +
          "onclick=\"stageActive('" + priceOpenCat + "','" + dEsc + "','" + sName + "'," + (shownActive?"false":"true") + ")\">" +
          (shownActive ? "🚫" : "👁") + "</button>" +
      "</div>";
    }).join("");

    // Нові послуги, які ще не підтверджені
    const newRows = Object.keys(pendingPrice).filter(k => {
      const ch = pendingPrice[k];
      return ch.type === "add" && ch.cat === priceOpenCat && ch.dept === dept;
    }).map(k => {
      const ch = pendingPrice[k];
      return "<div class='price-row pending'>" +
        "<span class='price-name'>" + ch.name + " <span class='price-new-tag'>нова</span></span>" +
        "<span class='price-unit'>" + (ch.unit || "") + "</span>" +
        "<span class='price-input-static'>" + ch.newValue + " ₴</span>" +
        "<span class='price-input-static'>" + (ch.term ? ch.term + " дн" : "—") + "</span>" +
        "<button class='price-btn' title='Прибрати' onclick=\"cancelPending('" + k.replace(/'/g,"\\'") + "')\">×</button>" +
      "</div>";
    }).join("");

    return "<div class='stat-panel' style='margin-bottom:12px'>" +
      "<div class='stat-panel-label'>" + dept + "</div>" +
      rows + newRows +
      "<div class='price-add'>" +
        "<input class='ic-mini' id='pa-name-" + id + "' placeholder='Нова послуга'>" +
        "<input class='ic-mini' style='max-width:100px' id='pa-unit-" + id + "' placeholder='Одиниця'>" +
        "<input class='ic-mini' style='max-width:80px' type='number' id='pa-price-" + id + "' placeholder='₴'>" +
        "<input class='ic-mini' style='max-width:72px' type='number' id='pa-term-" + id + "' placeholder='дн'>" +
        "<button class='ic-manual-add' onclick=\"stageAdd('" + priceOpenCat + "','" + dEsc + "')\">+</button>" +
      "</div>" +
    "</div>";
  }).join("");

  const n = Object.keys(pendingPrice).length;
  const bar = n ?
    "<div class='pending-bar'>" +
      "<span class='pending-count'>Незбережених змін: " + n + "</span>" +
      "<button class='pending-cancel' onclick='discardPending()'>Скасувати</button>" +
      "<button class='pending-confirm' onclick='openPriceConfirm()'>Переглянути та підтвердити</button>" +
    "</div>" : "";

  box.innerHTML = catTabs + body +
    "<div class='d-bonus-hint'>Зміни застосуються лише після підтвердження паролем. Приховані послуги не пропонуються при створенні замовлення, але ціна та історія зберігаються.</div>" +
    bar;
}
function hashId(str) { let h = 0; for (let i=0;i<str.length;i++) h = (h*31 + str.charCodeAt(i)) % 100000; return h; }
function setPriceCat(k) { priceOpenCat = k; renderPriceEditor(); }

function findPriceSvc(cat, dept, name) {
  const list = (PRICE[cat] && PRICE[cat].departments[dept]) || [];
  return list.find(s => s.name === name);
}

/* ─── Накопичення змін (без збереження) ─── */
let pendingPrice = {};

function stagePrice(cat, dept, name, value) {
  const v = parseInt(value);
  const s = findPriceSvc(cat, dept, name);
  if (!s) return;
  if (isNaN(v) || v < 0) { toast("Некоректна ціна"); renderPriceEditor(); return; }
  const key = "p|" + cat + "|" + dept + "|" + name;
  if (v === s.price) delete pendingPrice[key];
  else pendingPrice[key] = { type: "price", cat, dept, name, oldValue: s.price, newValue: v };
  renderPriceEditor();
}

function stageActive(cat, dept, name, makeActive) {
  const s = findPriceSvc(cat, dept, name);
  if (!s) return;
  const key = "a|" + cat + "|" + dept + "|" + name;
  const current = s.active !== false;
  if (makeActive === current) delete pendingPrice[key];
  else pendingPrice[key] = { type: "active", cat, dept, name, oldValue: current, newValue: makeActive };
  renderPriceEditor();
}

function stageTerm(cat, dept, name, value) {
  const s = findPriceSvc(cat, dept, name);
  if (!s) return;
  const raw = String(value).trim();
  const key = "t|" + cat + "|" + dept + "|" + name;
  const cur = String(s.term || "").trim();
  if (raw !== "" && (isNaN(parseInt(raw)) || parseInt(raw) < 0)) { toast("Термін — число днів"); renderPriceEditor(); return; }
  const norm = raw === "" ? "" : String(parseInt(raw));
  if (norm === cur) delete pendingPrice[key];
  else pendingPrice[key] = { type: "term", cat, dept, name, oldValue: cur, newValue: norm };
  renderPriceEditor();
}

function stageAdd(cat, dept) {
  const id = hashId(cat + dept);
  const nameEl = document.getElementById("pa-name-" + id);
  const unitEl = document.getElementById("pa-unit-" + id);
  const priceEl = document.getElementById("pa-price-" + id);
  const termEl = document.getElementById("pa-term-" + id);
  const name = nameEl.value.trim();
  const unit = unitEl.value.trim();
  const price = parseInt(priceEl.value || "0");
  const term = termEl && termEl.value.trim() ? String(parseInt(termEl.value)) : "";
  if (!name) { toast("Вкажіть назву послуги"); return; }
  if (!price) { toast("Вкажіть ціну"); return; }
  if (findPriceSvc(cat, dept, name)) { toast("Така послуга вже є"); return; }
  const key = "n|" + cat + "|" + dept + "|" + name;
  pendingPrice[key] = { type: "add", cat, dept, name, unit, term, newValue: price };
  nameEl.value = ""; unitEl.value = ""; priceEl.value = ""; if (termEl) termEl.value = "";
  renderPriceEditor();
}

function cancelPending(key) { delete pendingPrice[key]; renderPriceEditor(); }
function discardPending() {
  if (!confirm("Скасувати всі незбережені зміни?")) return;
  pendingPrice = {};
  renderPriceEditor();
}

async function priceApi(path, payload) {
  try {
    const res = await fetch(API_URL.replace("/order", path), {
      method: "POST", mode: "cors", headers: {"Content-Type":"application/json"},
      body: JSON.stringify(payload)
    });
    const r = await res.json();
    return r.status === "ok";
  } catch(e) { return false; }
}

async function applyPendingPrice() {
  const err = document.getElementById("price-confirm-err");
  const pw = document.getElementById("price-confirm-pw").value;
  if (!pw) { err.textContent = "Введіть пароль"; return; }
  let hash;
  try { hash = await sha256(pw); } catch(e) { err.textContent = "Помилка перевірки"; return; }
  if (hash !== ROLE_HASHES.admin) { err.textContent = "Невірний пароль"; return; }

  const btn = document.getElementById("price-confirm-btn");
  btn.textContent = "Збереження..."; btn.disabled = true;
  err.textContent = "";

  const keys = Object.keys(pendingPrice);
  let failed = 0;
  for (const k of keys) {
    const ch = pendingPrice[k];
    let ok = false;
    if (ch.type === "price") {
      ok = await priceApi("/price/update", { category: ch.cat, department: ch.dept, service: ch.name, price: ch.newValue });
      if (ok) { const s = findPriceSvc(ch.cat, ch.dept, ch.name); if (s) s.price = ch.newValue; }
    } else if (ch.type === "active") {
      ok = await priceApi("/price/update", { category: ch.cat, department: ch.dept, service: ch.name, active: ch.newValue });
      if (ok) { const s = findPriceSvc(ch.cat, ch.dept, ch.name); if (s) s.active = ch.newValue; }
    } else if (ch.type === "term") {
      ok = await priceApi("/price/update", { category: ch.cat, department: ch.dept, service: ch.name, term: ch.newValue });
      if (ok) { const s = findPriceSvc(ch.cat, ch.dept, ch.name); if (s) s.term = ch.newValue; }
    } else {
      ok = await priceApi("/price/add", { category: ch.cat, department: ch.dept, service: ch.name, unit: ch.unit, price: ch.newValue, term: ch.term || "" });
      if (ok) PRICE[ch.cat].departments[ch.dept].push({ name: ch.name, price: ch.newValue, unit: ch.unit, active: true, term: ch.term || "" });
    }
    if (ok) delete pendingPrice[k]; else failed++;
  }

  closePriceConfirm();
  renderPriceEditor();
  toast(failed ? ("Збережено з помилками: " + failed) : "Зміни застосовано");
}

/* ═══════════════ УСПІШНІСТЬ (вчасно / із запізненням) ═══════════════ */
function punctualityPanel(orders) {
  // Збираємо не лише цифри, а й самі записи — щоб можна було подивитись, що саме
  const lateOrders = [], onTimeOrders = [], noDataOrders = [];
  orders.forEach(o => {
    const num = gv(o,"Номер замовлення");
    const term = parseDeadline(gv(o,"Термін"));
    const its = ITEMS.filter(i => gv(i,"Номер замовлення") === num);
    const issuedDates = its.map(it => parseDeadline(gv(it,"Дата видачі"))).filter(Boolean);
    if (!term || !its.length || issuedDates.length !== its.length) { noDataOrders.push(o); return; }
    const lastIssued = new Date(Math.max.apply(null, issuedDates));
    const days = Math.round((lastIssued - term) / 86400000);
    if (lastIssued <= term) onTimeOrders.push(o);
    else lateOrders.push({ order: o, days: days });
  });

  // Задачі з дедлайном
  const lateTasks = [], onTimeTasks = [];
  const now = new Date(); now.setHours(0,0,0,0);
  TASKS.forEach(t => {
    const dl = parseDeadline(t["Дедлайн"]);
    if (!dl) return;
    if (t["Статус"] === "так") {
      const doneD = parseDeadline(t["Виконано"]);
      if (doneD && doneD > dl) lateTasks.push({ task: t, days: Math.round((doneD - dl)/86400000) });
      else onTimeTasks.push(t);
    } else if (dl < now) {
      lateTasks.push({ task: t, days: Math.round((now - dl)/86400000), open: true });
    }
  });

  const measured = onTimeOrders.length + lateOrders.length;
  const pct = measured ? Math.round(onTimeOrders.length / measured * 100) : null;
  const tTotal = onTimeTasks.length + lateTasks.length;
  const tPct = tTotal ? Math.round(onTimeTasks.length / tTotal * 100) : null;

  // Зберігаємо для перегляду деталей
  window._punct = { lateOrders, onTimeOrders, noDataOrders, lateTasks, onTimeTasks };

  const color = v => v === null ? "" : (v >= 85 ? "#2FA98C" : v >= 60 ? "#EF9F27" : "var(--st-postponed-fg)");

  function metric(label, value, sub, accent, kind, clickable) {
    return "<div class='pay-split-item" + (clickable ? " clickable" : "") + "'" +
      (clickable ? " onclick=\"openPunctList('" + kind + "')\"" : "") + ">" +
      "<div class='ps-label'>" + label + "</div>" +
      "<div class='ps-value'" + (accent ? " style='color:" + accent + "'" : "") + ">" + value + "</div>" +
      (sub ? "<div class='ps-sub'>" + sub + "</div>" : "") + "</div>";
  }

  return "<div class='stat-panel'><div class='stat-panel-label'>Успішність — чи вкладаємось у терміни</div>" +
    "<div class='pay-split'>" +
      metric("Замовлення вчасно", pct === null ? "—" : pct + "%",
             onTimeOrders.length + " з " + measured + " виданих", color(pct), "onTimeOrders", onTimeOrders.length > 0) +
      metric("Із запізненням", lateOrders.length,
             lateOrders.length ? "переглянути →" : "немає", lateOrders.length ? "var(--st-postponed-fg)" : "", "lateOrders", lateOrders.length > 0) +
      metric("Задачі вчасно", tPct === null ? "—" : tPct + "%",
             tTotal ? onTimeTasks.length + " з " + tTotal : "немає дедлайнів", color(tPct), "onTimeTasks", onTimeTasks.length > 0) +
      metric("Прострочені задачі", lateTasks.length,
             lateTasks.length ? "переглянути →" : "немає", lateTasks.length ? "var(--st-postponed-fg)" : "", "lateTasks", lateTasks.length > 0) +
    "</div>" +
    (noDataOrders.length ? "<div class='d-bonus-hint'>Ще " + noDataOrders.length + " замовлень без оцінки — немає терміну або виріб ще не видано.</div>" : "") +
    "</div>";
}

function sameDay(a, b) {
  return a && b && a.getDate() === b.getDate() && a.getMonth() === b.getMonth() && a.getFullYear() === b.getFullYear();
}
/* Локальна дата у форматі YYYY-MM-DD (без переводу в UTC — інакше день зсувається) */
function localISO(d) {
  const p = n => String(n).padStart(2,"0");
  return d.getFullYear() + "-" + p(d.getMonth()+1) + "-" + p(d.getDate());
}

/* Всі події календаря: дедлайни замовлень + дедлайни задач */
/* ═══════════════ ЗАВАНТАЖЕННЯ ДНІВ (планування термінів) ═══════════════
   Скільки активних робіт (не виданих) стоїть на конкретну дату — ремонт + пошив. */
function dayLoad(d) {
  let n = 0;
  ORDERS.forEach(o => {
    if (getStatus(gv(o,"Номер замовлення")) === "issued") return;
    const dl = parseDeadline(gv(o,"Термін"));
    if (dl && sameDay(dl, d)) n++;
  });
  TAILOR.forEach(t => {
    if (gv(t,"Статус") === "📦 Виданий") return;
    const dl = parseDeadline(gv(t,"Термін"));
    if (dl && sameDay(dl, d)) n++;
  });
  return n;
}
function loadLevel(load) {
  if (!DAILY_CAP) return "";
  if (load >= DAILY_CAP) return "full";
  if (load >= Math.ceil(DAILY_CAP * 0.6)) return "busy";
  return "free";
}
/* Найближча дата (з сьогодні), де завантаження нижче норми */
function recommendedDeadline() {
  if (!DAILY_CAP) return null;
  const base = new Date(); base.setHours(0,0,0,0);
  for (let i = 0; i < 180; i++) {
    const cur = new Date(base.getFullYear(), base.getMonth(), base.getDate() + i);
    if (dayLoad(cur) < DAILY_CAP) return cur;
  }
  return null;
}
function ddmmToISO(s) { const d = parseDeadline(s); return d ? localISO(d) : ""; }

/* Підказка під полем терміну: завантаження обраного дня + рекомендована дата */
function deadlineHintHTML(applyFn, pickedISO) {
  if (!DAILY_CAP) return "";
  let html = "";
  if (pickedISO) {
    const d = new Date(pickedISO + "T00:00:00");
    const load = dayLoad(d), lvl = loadLevel(load);
    const label = lvl === "full" ? "завантажено" : (lvl === "busy" ? "щільно" : "вільно");
    html += "<div class='deadline-load " + lvl + "'>На " + formatDeadlineDate(pickedISO) + ": " + load + " з " + DAILY_CAP + " — " + label + "</div>";
  }
  const reco = recommendedDeadline();
  if (reco) {
    const iso = localISO(reco);
    const rload = dayLoad(reco);
    html += "<button type='button' class='deadline-reco' onclick=\"" + applyFn + "('" + iso + "')\">Рекомендовано: " + formatDeadlineDate(iso) + " (" + rload + " з " + DAILY_CAP + ") · застосувати</button>";
  }
  return html;
}

      const st = getStatus(num);
      const done = st === "issued";
      const now = new Date(); now.setHours(0,0,0,0);
      events.push({
        type: "order", date: d, done: done,
        late: !done && d < now,
        title: num + " " + (gv(o,"Ім'я клієнта") || ""),
        sub: orderServices(num),
        ref: num
      });
    });
  }
  if (calFilter === "all" || calFilter === "tasks") {
    TASKS.forEach(t => {
      const d = parseDeadline(t["Дедлайн"]);
      if (!d) return;
      const done = t["Статус"] === "так";
      const now = new Date(); now.setHours(0,0,0,0);
      events.push({
        type: "task", date: d, done: done,
        late: !done && d < now,
        title: t["Текст"],
        sub: t["Замовлення"] ? t["Замовлення"] : "",
        ref: t["Замовлення"] || ""
      });
    });
  }
  if (calFilter === "all" || calFilter === "tailor") {
    TAILOR.forEach(t => {
      const d = parseDeadline(gv(t,"Термін"));
      if (!d) return;
      const done = gv(t,"Статус") === "📦 Виданий";
      const now = new Date(); now.setHours(0,0,0,0);
      events.push({
        type: "tailor", date: d, done: done,
        late: !done && d < now,
        title: gv(t,"Номер") + " " + (gv(t,"Виріб") || ""),
        sub: gv(t,"Ім'я клієнта"),
        ref: gv(t,"Номер")
      });
    });
  }
  return events;
}

renderers.calendar = function() {
  const page = document.getElementById("page-calendar");
  const events = calendarEvents();
  const today = new Date(); today.setHours(0,0,0,0);

  // Перший день сітки (понеділок тижня, в якому 1-е число)
  const first = new Date(calYear, calMonth, 1);
  let startOffset = (first.getDay() + 6) % 7; // Пн = 0
  const gridStart = new Date(calYear, calMonth, 1 - startOffset);

  let cells = "";
  for (let i = 0; i < 42; i++) {
    const d = new Date(gridStart.getFullYear(), gridStart.getMonth(), gridStart.getDate() + i);
    const inMonth = d.getMonth() === calMonth;
    const isToday = sameDay(d, today);
    const dayEvents = events.filter(e => sameDay(e.date, d));
    const evHTML = dayEvents.slice(0, 3).map(e =>
      "<div class='cal-ev " + (e.late ? "late" : e.type) + "'>" + (e.done ? "✓ " : "") + e.title + "</div>"
    ).join("");
    const more = dayEvents.length > 3 ? "<div class='cal-more'>+" + (dayEvents.length - 3) + " ще</div>" : "";
    const load = inMonth ? dayLoad(d) : 0;
    const loadBadge = (inMonth && DAILY_CAP && load > 0)
      ? "<span class='cal-load " + loadLevel(load) + "'>" + load + "</span>" : "";
    cells += "<div class='cal-cell" + (inMonth ? "" : " other") + (isToday ? " today" : "") + "' onclick=\"openCalDay('" + localISO(d) + "')\">" +
      "<div class='cal-dayhead'><span class='cal-daynum'>" + d.getDate() + "</span>" + loadBadge + "</div>" + evHTML + more + "</div>";
  }

  const dowHTML = DOW_NAMES.map(n => "<div class='cal-dow'>" + n + "</div>").join("");
  const filterBtn = (k, label) =>
    "<button class='mt-btn" + (calFilter===k?" active":"") + "' onclick=\"setCalFilter('" + k + "')\">" + label + "</button>";

  page.innerHTML =
    groupSwitcher("planning") +
    "<div class='page-header'><div class='page-title'>Календар</div></div>" +
    "<div class='tab-scroll'>" +
      "<div class='cal-head'>" +
        "<button class='cal-nav-btn' onclick='calShift(-1)'>‹</button>" +
        "<span class='cal-month'>" + MONTH_NAMES[calMonth] + " " + calYear + "</span>" +
        "<button class='cal-nav-btn' onclick='calShift(1)'>›</button>" +
        "<button class='cal-today-btn' onclick='calToday()'>Сьогодні</button>" +
        "<div class='cal-filters'>" + filterBtn("all","Все") + filterBtn("orders","Ремонт") + filterBtn("tailor","Виготовлення") + filterBtn("tasks","Задачі") + "</div>" +
      "</div>" +
      "<div class='cal-grid'>" + dowHTML + cells + "</div>" +
    "</div>";
};

function calShift(delta) {
  calMonth += delta;
  if (calMonth < 0) { calMonth = 11; calYear--; }
  if (calMonth > 11) { calMonth = 0; calYear++; }
  renderers.calendar();
}
function calToday() {
  const n = new Date();
  calMonth = n.getMonth(); calYear = n.getFullYear();
  renderers.calendar();
}
function setCalFilter(k) { calFilter = k; renderers.calendar(); }

let BONUS_PCT = 3;            // базовий відсоток (запасний варіант)
/* Відсоток нарахування за статусом клієнта. null → береться базовий */
let BONUS_PCT_RATING = { green: null, yellow: null, red: null };

function bonusPctFor(phone) {
  const r = clientRating(phone);
  const v = BONUS_PCT_RATING[r.key];
  return (v === null || v === undefined || isNaN(v)) ? BONUS_PCT : v;
}
let BONUS_MIN_SPEND = 200;    // мінімальний баланс для списання балів
let BONUS_SPEND_CAP = 30;     // максимум списання, % від суми чека

/* Баланс балів клієнта = сума нарахованих - сума списаних по всіх замовленнях телефону */
function clientBonusBalance(phone) {
  let accrued = 0, spent = 0;
  ORDERS.filter(o => gv(o,"Телефон") === phone).forEach(o => {
    accrued += extractAmt(gv(o,"Нараховано бонусів"));
    spent += extractAmt(gv(o,"Списано бонусів"));
  });
  return accrued - spent;
}

const ITEM_STATUSES = [
  ["🆕 Новий", "Прийнято", "#378ADD"],
  ["⚙️ В роботі", "В роботі", "#EF9F27"],
  ["✅ Готово", "Готово", "#639922"],
  ["📦 Виданий", "Видано", "#639922"]
];
function itemStatusIndex(status) {
  if (status === "📦 Виданий") return 3;
  if (status === "✅ Готово") return 2;
  if (status === "⚙️ В роботі") return 1;
  return 0;
}

/* Звальний відмінок (кличний) — мʼяке відмінювання */
function vocative(name) {
  if (!name) return "";
  const parts = name.trim().split(/\s+/);
  const first = parts[0];
  const lc = first.toLowerCase();
  // жіночі на -а/-я
  if (/[бвгґджзклмнпрстфхцчшщ]а$/i.test(first)) return first.slice(0,-1) + "о";
  if (/ія$/i.test(first)) return first.slice(0,-1) + "є";
  if (/[зждлр]я$/i.test(first)) return first.slice(0,-1) + "е";
  // чоловічі на приголосний
  if (/[бвгґджзклмнпрстфхцчшщ]$/i.test(first)) {
    if (/[гґкх]$/i.test(first)) return first + "у";
    return first + "е";
  }
  if (/й$/i.test(first)) return first.slice(0,-1) + "ю";
  if (/о$/i.test(first)) return first;
  return first;
}

let detailOrderNum = null;

/* Статичний міні-календар поточного місяця з позначеним терміном (клік поки не працює — доопрацюємо окремо) */
function buildMiniCal(termStr) {
  const now = new Date();
  const monthNames = ["Січень","Лютий","Березень","Квітень","Травень","Червень","Липень","Серпень","Вересень","Жовтень","Листопад","Грудень"];
  let selDay = null;
  const m = (termStr || "").match(/^(\d{1,2})\.(\d{1,2})\.(\d{4})$/);
  if (m && parseInt(m[2]) === now.getMonth()+1 && parseInt(m[3]) === now.getFullYear()) selDay = parseInt(m[1]);

  const first = new Date(now.getFullYear(), now.getMonth(), 1);
  const startOffset = (first.getDay() + 6) % 7; // понеділок=0
  const daysInMonth = new Date(now.getFullYear(), now.getMonth()+1, 0).getDate();
  const daysInPrev = new Date(now.getFullYear(), now.getMonth(), 0).getDate();

  let cells = "";
  for (let i = startOffset; i > 0; i--) cells += "<div class='mini-cal-day mut'>" + (daysInPrev - i + 1) + "</div>";
  for (let d = 1; d <= daysInMonth; d++) cells += "<div class='mini-cal-day" + (d === selDay ? " sel" : "") + "'>" + d + "</div>";

  const dow = ["Пн","Вт","Ср","Чт","Пт","Сб","Нд"].map(d => "<div class='mini-cal-dow'>" + d + "</div>").join("");
  const label = termStr ? termStr : (selDay ? "" : "без терміну");
  return "<div class='mini-cal'><div class='mini-cal-head'><span>" + monthNames[now.getMonth()] + " " + now.getFullYear() + "</span><span style='color:var(--txt-3);font-size:10px'>" + label + "</span></div>" +
    "<div class='mini-cal-grid'>" + dow + cells + "</div></div>";
}

/* Рейтинг клієнта за розрахунками: чи забирає виріб оплаченим */
const RATING_META = {
  green:  { dot: "🟢", label: "Розраховується" },
  yellow: { dot: "🟡", label: "Звичайний" },
  red:    { dot: "🔴", label: "Є борг" }
};

/* Підсумок по грошах клієнта: скільки винен за вже видані роботи */
function clientPaymentStats(phone) {
  let issuedDebt = 0, settledOrders = 0, openDebt = 0;

  ORDERS.filter(o => gv(o,"Телефон") === phone).forEach(o => {
    const num = gv(o,"Номер замовлення");
    const total = orderTotal(num);
    if (!total) return;
    const payStr = gv(o,"Оплата");
    const prepay = isPrepayStr(payStr) ? extractAmt(payStr) : 0;
    const settle = extractAmt(gv(o,"Сума доплати"));
    const debt = Math.max(0, total - prepay - settle);
    const st = getStatus(num);
    if (st === "issued" || st === "partial") {
      if (debt > 0) issuedDebt += debt; else settledOrders++;
    } else if (debt > 0) openDebt += debt;
  });

  TAILOR.filter(t => gv(t,"Телефон") === phone).forEach(t => {
    const total = extractAmt(gv(t,"Вартість"));
    if (!total) return;
    const payStr = gv(t,"Оплата");
    const prepay = isPrepayStr(payStr) ? extractAmt(payStr) : 0;
    const settle = extractAmt(gv(t,"Сума доплати"));
    const debt = Math.max(0, total - prepay - settle);
    if (gv(t,"Статус") === "📦 Виданий") {
      if (debt > 0) issuedDebt += debt; else settledOrders++;
    } else if (debt > 0) openDebt += debt;
  });

  return { issuedDebt, settledOrders, openDebt };
}

/* Ручне перевизначення рейтингу (остання непорожня позначка по телефону) */
function manualRating(phone) {
  const orders = ORDERS.filter(o => gv(o,"Телефон") === phone);
  for (let i = orders.length - 1; i >= 0; i--) {
    const v = gv(orders[i], "Рейтинг вручну");
    if (v) return v;
  }
  return "";
}

function clientRating(phone) {
  const manual = manualRating(phone);
  if (manual && RATING_META[manual]) {
    return Object.assign({}, RATING_META[manual], { manual: true, key: manual });
  }
  const s = clientPaymentStats(phone);
  // Робота видана, а гроші не отримані — головний сигнал
  if (s.issuedDebt > 0) {
    return Object.assign({}, RATING_META.red, { key: "red", debt: s.issuedDebt });
  }
  // Є закриті замовлення і всі розраховані
  if (s.settledOrders > 0) {
    return Object.assign({}, RATING_META.green, { key: "green" });
  }
  return Object.assign({}, RATING_META.yellow, { key: "yellow" });
}

async function assignMaster(num, itemIdx, action, master) {
  const its = ITEMS.filter(i => gv(i,"Номер замовлення") === num);
  const it = its[itemIdx];
  if (!it) return;
  const nowVal = new Date().toLocaleDateString("uk-UA",{day:"2-digit",month:"2-digit",year:"numeric"}) + " " + new Date().toLocaleTimeString("uk-UA",{hour:"2-digit",minute:"2-digit"});
  const status = action === "work" ? "⚙️ В роботі" : "📦 Виданий";
  it["Статус"] = status;
  if (action === "work") { it["Майстер"] = master; it["Дата в роботі"] = nowVal; }
  else { it["Хто видав"] = master; it["Дата видачі"] = nowVal; }
  // Видача без попереднього сповіщення — закриваємо "хвіст": клієнт і так забрав річ,
  // нема сенсу далі показувати "не сповіщено" по факту вже виданого замовлення.
  const wasNotified = action === "issue" ? !!gv(it,"Сповіщено") : true;
  if (action === "issue" && !wasNotified) it["Сповіщено"] = nowVal;
  closeSettle();
  openOrder(num);
  const itemNum = gv(it,"Номер виробу") || (num + "-" + (itemIdx+1));
  try {
    await fetch(API_URL.replace("/order","/status"), {
      method: "POST", mode: "cors", headers: {"Content-Type":"application/json"},
      body: JSON.stringify({ item_num: itemNum, status: status, master: master })
    });
    if (action === "issue" && !wasNotified) {
      await fetch(API_URL.replace("/order","/notify"), {
        method: "POST", mode: "cors", headers: {"Content-Type":"application/json"},
        body: JSON.stringify({ item_num: itemNum, notified: true })
      });
    }
  } catch(e) { console.error("assign master failed", e); }
}

      method: "POST", mode: "cors", headers: {"Content-Type":"application/json"},

    });
  } catch(e) { console.error("settle failed", e); }

  // Якщо це фінальний платіж (замовлення тепер повністю оплачене) — пропонуємо бонуси одним потоком
  if (o) {
    const total = orderTotal(num);
    const payStr = gv(o,"Оплата");
    const prepayAmt = extractAmt(payStr);
    const status = computePayStatus(total, payStr, prepayAmt, amt);
    if (status.isPaid) startPostPaymentBonusFlow(num);
  }
}

/* ═══════ ПОТІК БОНУСІВ ПІСЛЯ ФІНАЛЬНОЇ ОПЛАТИ ═══════
   Спочатку пропонуємо списати наявний баланс (якщо є), одразу після —
   нарахувати нові бали. Кожен крок можна пропустити. */
function startPostPaymentBonusFlow(num) {
  const o = ORDERS.find(x => gv(x,"Номер замовлення") === num);
  if (!o) return;
  const phone = gv(o,"Телефон");
  const total = orderTotal(num);
  const balance = clientBonusBalance(phone);
  const spent = extractAmt(gv(o,"Списано бонусів"));
  if (balance >= BONUS_MIN_SPEND && !spent) {
    promptSpendStep(num, balance, total);
  } else {
    promptAccrueStep(num, total);
  }
}
function promptSpendStep(num, balance, total) {
  const maxByOrder = Math.floor(total * BONUS_SPEND_CAP / 100);
  const maxSpend = Math.min(balance, maxByOrder);
  const body = document.getElementById("odm-body");
  const wrap = document.createElement("div");
  wrap.className = "settle-overlay";
  wrap.innerHTML =
    "<div class='settle-card'>" +
      "<div class='dblock-label'>Списати бонуси?</div>" +
      "<div style='font-size:12px;color:var(--txt-2);margin-bottom:10px'>Доступно: " + balance + " · макс. для цього чека (" + BONUS_SPEND_CAP + "%): " + maxByOrder + "</div>" +
      "<input class='cr-input' id='spend-amt' type='number' value='" + maxSpend + "' max='" + maxSpend + "'>" +
      "<div style='display:flex;gap:8px;margin-top:10px'>" +
        "<button onclick=\"skipSpendStep('" + num + "'," + total + ")\" style='flex:1;background:none;border:1px solid var(--field-border);border-radius:8px;color:var(--txt-2);padding:11px;cursor:pointer;font-family:Commissioner,sans-serif;font-size:12px'>Пропустити</button>" +
        "<button class='d-settle-btn' style='flex:2;margin-top:0' onclick=\"confirmSpendStep('" + num + "'," + maxSpend + "," + total + ")\">Списати</button>" +
      "</div>" +
    "</div>";
  body.appendChild(wrap);
}
async function confirmSpendStep(num, maxSpend, total) {
  let amt = parseInt(document.getElementById("spend-amt").value || "0");
  if (amt > maxSpend) amt = maxSpend;
  if (amt > 0) {
    const o = ORDERS.find(x => gv(x,"Номер замовлення") === num);
    if (o) o["Списано бонусів"] = String(amt);
    try {
      await fetch(API_URL.replace("/order","/bonus"), {
        method: "POST", mode: "cors", headers: {"Content-Type":"application/json"},
        body: JSON.stringify({ order_num: num, spent: amt })
      });
    } catch(e) { console.error("spend failed", e); }
  }
  closeSettle();
  promptAccrueStep(num, total);
}
function skipSpendStep(num, total) {
  closeSettle();
  promptAccrueStep(num, total);
}
function promptAccrueStep(num, total) {
  if (detailOrderNum) openOrder(detailOrderNum);
  const o = ORDERS.find(x => gv(x,"Номер замовлення") === num);
  if (!o) return;
  const accrued = extractAmt(gv(o,"Нараховано бонусів"));
  if (accrued) return;
  const phone = gv(o,"Телефон");
  const clientPct = bonusPctFor(phone);
  if (clientPct <= 0) return;
  const wouldAccrue = Math.round(total * clientPct / 100);
  const body = document.getElementById("odm-body");
  const wrap = document.createElement("div");
  wrap.className = "settle-overlay";
  wrap.innerHTML =
    "<div class='settle-card'>" +
      "<div class='dblock-label'>Нарахувати бонуси?</div>" +
      "<div style='font-size:12px;color:var(--txt-2);margin-bottom:10px'>" + clientPct + "% від суми чека — за статусом клієнта.</div>" +
      "<input class='cr-input' id='accrue-amt' type='number' value='" + wouldAccrue + "'>" +
      "<div style='display:flex;gap:8px;margin-top:10px'>" +
        "<button onclick='skipAccrueStep()' style='flex:1;background:none;border:1px solid var(--field-border);border-radius:8px;color:var(--txt-2);padding:11px;cursor:pointer;font-family:Commissioner,sans-serif;font-size:12px'>Пропустити</button>" +
        "<button class='d-settle-btn' style='flex:2;margin-top:0;background:#2FA98C' onclick=\"confirmAccrueStep('" + num + "')\">Нарахувати</button>" +
      "</div>" +
    "</div>";
  body.appendChild(wrap);
}
async function confirmAccrueStep(num) {
  const amt = parseInt(document.getElementById("accrue-amt").value || "0");
  closeSettle();
  if (amt > 0) {
    const o = ORDERS.find(x => gv(x,"Номер замовлення") === num);
    if (o) o["Нараховано бонусів"] = String(amt);
    if (detailOrderNum) openOrder(detailOrderNum);
    try {
      await fetch(API_URL.replace("/order","/bonus"), {
        method: "POST", mode: "cors", headers: {"Content-Type":"application/json"},
        body: JSON.stringify({ order_num: num, accrued: amt })
      });
    } catch(e) { console.error("accrue failed", e); }
  }
}
function skipAccrueStep() {
  closeSettle();
}

function openRatingPick(phone) {

async function saveRating(phone, rating) {
  // локально: пишемо в останнє замовлення цього телефону
  const orders = ORDERS.filter(o => gv(o,"Телефон") === phone);
  if (orders.length) orders[orders.length-1]["Рейтинг вручну"] = rating;
  closeSettle();
  if (detailOrderNum) openOrder(detailOrderNum); else if (renderers[currentPage]) renderers[currentPage]();
  try {
    await fetch(API_URL.replace("/order","/client/rating"), {
      method: "POST", mode: "cors", headers: {"Content-Type":"application/json"},
      body: JSON.stringify({ phone: phone, rating: rating })
    });
  } catch(e) { console.error("rating save failed", e); }
}

/* ─── БОНУСИ: нарахування з можливістю змінити суму ─── */
function openAccrueBonus(num, suggested) {
  if (!isAdmin()) { toast("Бонуси доступні лише адміністратору"); return; }
  const body = document.querySelector("#bonus-modal.open .odm-scroll") || document.getElementById("odm-body");
  const wrap = document.createElement("div");
  wrap.className = "settle-overlay";
  wrap.innerHTML =
    "<div class='settle-card'>" +
      "<div class='dblock-label'>Нарахувати бонуси</div>" +
      "<div style='font-size:12px;color:var(--txt-2);margin-bottom:10px'>Стандартно " + BONUS_PCT + "% від суми чека. Можна змінити або не нараховувати взагалі.</div>" +
      "<input class='cr-input' id='accrue-amt' type='number' value='" + suggested + "'>" +
      "<div style='display:flex;gap:8px;margin-top:10px'>" +

        "<button class='d-settle-btn' style='flex:2;margin-top:0;background:#2FA98C' onclick=\"confirmAccrue('" + num + "')\">Нарахувати</button>" +

}
function confirmAccrue(num) {

async function accrueBonus(num, amount) {

  openOrder(num);
  try {
    await fetch(API_URL.replace("/order","/bonus"), {
      method: "POST", mode: "cors", headers: {"Content-Type":"application/json"},
      body: JSON.stringify({ order_num: num, accrued: amount })
    });
  } catch(e) { console.error("accrue failed", e); }
}

    "<div class='settle-card'>" +
      "<div class='dblock-label'>Списати бали</div>" +

      "<input class='cr-input' id='spend-amt' type='number' value='" + maxSpend + "' max='" + maxSpend + "'>" +
      "<div style='display:flex;gap:8px;margin-top:10px'>" +
        "<button onclick='closeSettle()' style='flex:1;background:none;border:1px solid var(--field-border);border-radius:8px;color:var(--txt-2);padding:11px;cursor:pointer;font-family:Commissioner,sans-serif;font-size:12px'>Скасувати</button>" +

async function confirmSpendBonus(num, maxSpend) {

  if (o) o["Списано бонусів"] = String(amt);
  closeSettle();
  openOrder(num);
  try {
    await fetch(API_URL.replace("/order","/bonus"), {
      method: "POST", mode: "cors", headers: {"Content-Type":"application/json"},
      body: JSON.stringify({ order_num: num, spent: amt })
    });
  } catch(e) { console.error("spend failed", e); }
}
const NOTIFY_TEMPLATES = {
  ready:    (v, num, item) => "Доброго дня, " + v + "! Ваше замовлення " + num + " (" + item + ") готове до видачі. Чекаємо вас у Rewise Studio. Дякуємо, що обрали нас.",
  remind:   (v, num, item) => "Доброго дня, " + v + "! Нагадуємо, що ваше замовлення " + num + " (" + item + ") готове та очікує на видачу в Rewise Studio.",
  accepted: (v, num, item) => "Доброго дня, " + v + "! Ваше замовлення " + num + " (" + item + ") прийнято в роботу. Повідомимо, щойно буде готове. Rewise Studio."
};
function copyNotify(num, type) {
  const o = ORDERS.find(x => gv(x,"Номер замовлення") === num);
  if (!o) return;
  const v = vocative(gv(o,"Ім'я клієнта"));
  const shortNum = num.replace("RW-","№");
  const item = orderItemName(num);
  const text = NOTIFY_TEMPLATES[type](v, shortNum, item);
  copyToClipboard(text);
}
function copyToClipboard(text) {
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(() => toast("Текст скопійовано")).catch(() => fallbackCopy(text));
  } else fallbackCopy(text);
}
function fallbackCopy(text) {
  const ta = document.createElement("textarea");
  ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
  document.body.appendChild(ta); ta.select();
  try { document.execCommand("copy"); toast("Текст скопійовано"); } catch(e) { alert(text); }
  document.body.removeChild(ta);
}
let toastTimer = null;
function toast(msg) {
  let t = document.getElementById("rw-toast");
  if (!t) { t = document.createElement("div"); t.id = "rw-toast"; document.body.appendChild(t); }
  t.textContent = msg; t.className = "show";
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.className = "", 2000);
}
