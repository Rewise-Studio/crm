<!doctype html>
<html lang="uk"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Розподіл</title>
<link href="https://fonts.googleapis.com/css2?family=Commissioner:wght@300;400;500;600;700&family=Tenor+Sans&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:#f6f3ec;font-family:'Commissioner',system-ui,sans-serif;color:#2b2722;-webkit-text-size-adjust:100%}
#app{max-width:760px;margin:0 auto;padding:0 0 90px}
.hd{padding:calc(16px + env(safe-area-inset-top,0px)) 16px 8px;display:flex;align-items:baseline;gap:10px}
.hd h1{font-family:'Tenor Sans',serif;font-weight:400;font-size:22px;margin:0;flex:1}
.hd span{font-size:12.5px;color:#8a8376}
.lab{font-size:11px;color:#8a8376;margin:14px 16px 4px;text-transform:uppercase;letter-spacing:.06em}
.list{padding:0 12px}
.card{background:#fff;border:1px solid #f1ecdf;border-radius:12px;padding:10px 12px;margin-bottom:8px}
.nr{display:flex;align-items:baseline;gap:8px}
.n{font-family:'Tenor Sans',serif;font-size:17px}
.k{font-size:11px;color:#8a8376}
.pc{margin-left:auto;font-size:13.5px;font-weight:700}
.sv{font-size:13.5px;font-weight:600;margin:4px 0 1px}
.it{font-size:11.5px;color:#6b655b}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}
.chip{padding:8px 14px;border-radius:18px;border:1px solid #c9c1ae;background:#fff;font:inherit;font-size:13px;cursor:pointer}
.chip:active{transform:scale(.96)}
.chip.on{background:#a3865c;border-color:#a3865c;color:#fff}
.chip.sm{padding:6px 12px;font-size:12.5px}
.lr{display:flex;align-items:center;gap:10px;font-size:13px;margin:7px 0}
.lr .nm{width:90px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lr .bar{flex:1;height:8px;background:#eee7d6;border-radius:4px;overflow:hidden}
.lr .bar i{display:block;height:100%;background:#a3865c;transition:width .4s}
.lr .v{width:26px;text-align:right;color:#6b655b}
.box{margin:0 14px;background:#fff;border:1px solid #e3d6bb;border-radius:14px;padding:12px 14px;font-size:13.5px;line-height:1.65}
.box .t{font-weight:600;margin-bottom:3px}
.box .m{color:#6b655b}
.pad{padding:0 14px}
.empty{padding:22px 16px;text-align:center;font-size:13px;color:#8a8376}
.msg{padding:50px 22px;text-align:center;color:#6b655b;line-height:1.6}
.msg h2{font-family:'Tenor Sans',serif;font-weight:400;color:#2b2722}
.msg input{font:inherit;font-size:16px;padding:11px 12px;border:1px solid #c9c1ae;border-radius:10px;width:100%;max-width:340px;margin:10px 0}
.msg button{font:inherit;font-weight:600;background:#a3865c;color:#fff;border:0;border-radius:10px;padding:11px 20px;cursor:pointer}
.errb{margin:0 14px 10px;background:#fbe9e7;color:#8c1d18;border-radius:10px;padding:8px 12px;font-size:12.5px}
.snack{position:fixed;left:14px;right:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));max-width:520px;margin:0 auto;background:#2b2722;color:#fff;border-radius:12px;padding:12px 14px;font-size:14px;display:flex;justify-content:space-between;align-items:center}
.snack u{color:#e6c98f;cursor:pointer;margin-left:12px}
</style></head>
<body>
<div id="app"></div>
<script>
var API = "https://price-production-97b5.up.railway.app";
var TOKEN = "", B = null, RP = "week", ERR = "", BAD = false, SNACK = null, PEND = {};

function money(n) { return String(Math.round(Number(n) || 0)).replace(/\B(?=(\d{3})+(?!\d))/g, " ") + " ₴"; }
function esc(s) { return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }
function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
function lsDel(k) { try { localStorage.removeItem(k); } catch (e) {} }

function call(path, body, keep) {
  return fetch(API + path, { method: "POST", mode: "cors", keepalive: !!keep,
    headers: { "Content-Type": "application/json", "X-Admin-Token": TOKEN }, body: JSON.stringify(body || {}) })
    .then(function (r) { return r.json().then(function (j) { j._http = r.status; return j; }); });
}
function load() {
  if (!TOKEN) { render(); return; }
  call("/admin/board").then(function (j) {
    if (j.status === "ok") { B = j; ERR = ""; BAD = false; }
    else if (j._http === 401) { BAD = true; }
    else { ERR = j.message || "Не вдалося оновити"; }
    render();
  }).catch(function () { ERR = B ? "Немає зв'язку. Показано останні дані" : "Немає зв'язку"; render(); });
}

function pendingIds() { return Object.keys(PEND); }
function localLoad() {
  var l = {}; (B.masters || []).forEach(function (m) { l[m] = B.load[m] || 0; });
  pendingIds().forEach(function (id) { var m = PEND[id].master; if (l[m] != null) l[m]++; });
  return l;
}
function render() {
  var el = document.getElementById("app");
  if (!TOKEN || BAD) {
    el.innerHTML = "<div class='msg'><h2>Розподіл</h2>" + (BAD ? "Ключ не підійшов. Введіть ще раз." : "Введіть ключ адміністратора. Це робиться один раз на пристрої.") +
      "<br><input id='tk' type='password' autocomplete='off' placeholder='Ключ'><br><button onclick='saveKey()'>Увійти</button></div>";
    return;
  }
  if (!B) { el.innerHTML = "<div class='msg'>" + esc(ERR || "Завантаження...") + "</div>"; return; }
  var un = B.unassigned.filter(function (u) { return !PEND[u.id]; });
  var h = "<div class='hd'><h1>Розподіл</h1><span>Не призначені: <b>" + un.length + "</b></span></div>" + (ERR ? "<div class='errb'>" + esc(ERR) + "</div>" : "");
  h += "<div class='lab'>Не призначені</div><div class='list'>";
  if (!un.length) h += "<div class='empty'>Усе розподілено</div>";
  un.forEach(function (u) {
    h += "<div class='card'><div class='nr'><span class='n'>" + esc(u.order) + "</span><span class='k'>" + esc(u.item) + "</span><span class='pc'>" + money(u.price) + "</span></div>" +
      "<div class='sv'>" + esc(u.svc) + "</div><div class='it'>" + esc(u.what) + (u.term ? " · термін " + esc(u.term) : "") + (u.client ? " · " + esc(u.client) : "") + "</div><div class='chips'>";
    B.masters.forEach(function (m) { h += "<button class='chip' data-id='" + esc(u.id) + "' data-m='" + esc(m) + "' onclick='assign(this)'>" + esc(m) + "</button>"; });
    h += "</div></div>";
  });
  h += "</div><div class='lab'>Навантаження (відкриті роботи)</div><div class='pad'>";
  var l = localLoad(), mx = 1; B.masters.forEach(function (m) { if (l[m] > mx) mx = l[m]; });
  B.masters.forEach(function (m) {
    h += "<div class='lr'><span class='nm'>" + esc(m) + "</span><div class='bar'><i style='width:" + Math.round(l[m] * 100 / mx) + "%'></i></div><span class='v'>" + l[m] + "</span></div>";
  });
  var r = B.report[RP];
  h += "</div><div class='lab'>Звіт</div><div class='chips pad' style='margin-top:0'>" +
    "<button class='chip sm" + (RP === "week" ? " on" : "") + "' onclick=\"setRp('week')\">Тиждень</button>" +
    "<button class='chip sm" + (RP === "month" ? " on" : "") + "' onclick=\"setRp('month')\">Місяць</button></div>" +
    "<div class='box' style='margin-top:8px'><div class='t'>" + esc(r.title) + "</div>" +
    "Закрито робіт: <b>" + r.closed + "</b> на " + money(r.sum) + "<br>Отримано грошима: <b>" + money(r.got) + "</b><br>" +
    "<span class='m'>Залишилось у роботі: " + r.left + (r.late ? " · прострочено " + r.late : "") + "</span></div>";
  if (SNACK) h += "<div class='snack'><span>" + esc(SNACK) + "</span><u onclick='undo()'>Скасувати</u></div>";
  el.innerHTML = h;
}
function saveKey() {
  var v = (document.getElementById("tk").value || "").trim(); if (!v) return;
  TOKEN = v; lsSet("rw_admin_token", v); BAD = false; load();
}
function setRp(k) { RP = k; render(); }

/* Призначення з паузою на скасування: на сервер йде через 4 с (тоді ж майстру приходить повідомлення) */
function assign(btn) {
  var id = btn.getAttribute("data-id"), m = btn.getAttribute("data-m");
  var u = B.unassigned.filter(function (x) { return x.id === id; })[0]; if (!u || PEND[id]) return;
  PEND[id] = { master: m, u: u, t: setTimeout(function () { commit(id); }, 4000) };
  SNACK = u.order + " " + u.item + " → " + m; LASTID = id;
  render();
  clearTimeout(window.__sn); window.__sn = setTimeout(function () { SNACK = null; render(); }, 4000);
}
var LASTID = "";
function undo() {
  var p = PEND[LASTID]; if (!p) return;
  clearTimeout(p.t); delete PEND[LASTID]; SNACK = null; render();
}
function commit(id, keep) {
  var p = PEND[id]; if (!p) return;
  call("/admin/assign", { svc: id, master: p.master }, keep).then(function (j) {
    delete PEND[id];
    if (j.status !== "ok") { ERR = j.message || "Не вдалося призначити"; }
    load();
  }).catch(function () { delete PEND[id]; ERR = "Не вдалося призначити. Спробуйте ще раз"; load(); });
}
function flush() { pendingIds().forEach(function (id) { clearTimeout(PEND[id].t); commit(id, true); }); }

TOKEN = lsGet("rw_admin_token") || "";
render(); load();
setInterval(function () { if (!document.hidden && !pendingIds().length) load(); }, 45000);
document.addEventListener("visibilitychange", function () { if (document.hidden) flush(); else load(); });
window.addEventListener("pagehide", flush);
</script>
</body></html>
